<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0b0e12" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Lanka Data Layer — every Sri Lankan fact with a location, a source and a download. Open API, MCP server, CLI, maps and area profiles." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lanka Data Layer — open geo-data for Sri Lanka</title>
    <script>
      try {
        var t = localStorage.getItem('ldl-theme');
        if (!t) t = /^\/(explore)?$/.test(location.pathname) ? 'dark' : 'light';
        document.documentElement.className = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
