# Host nginx vhost for lanka-data-layer.prabhavalabs.com.
# Install: copy (or symlink) to /etc/nginx/sites-available/lanka-data-layer,
# link into sites-enabled, `nginx -t && systemctl reload nginx`, then run
# certbot --nginx -d lanka-data-layer.prabhavalabs.com (certbot rewrites this
# file in place with the TLS server block).
server {
    server_name lanka-data-layer.prabhavalabs.com;

    root /opt/lanka-data-layer/web-dist;
    index index.html;

    # API — container bound to loopback (infra/docker-compose.yml).
    location /v1/ {
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static SPA — hashed assets cache forever, index.html revalidates.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen 80;
    listen [::]:80;
}
