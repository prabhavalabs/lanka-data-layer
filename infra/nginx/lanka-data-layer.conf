# Host nginx vhost for lanka-data-layer.prabhavalabs.com.
# Install: copy (or symlink) to /etc/nginx/sites-available/lanka-data-layer,
# link into sites-enabled, install nginx/lanka-data-layer-limits.conf to
# /etc/nginx/conf.d/ (rate-limit zones, required by the limit_req lines
# below), `nginx -t && systemctl reload nginx`, then run
# certbot --nginx -d lanka-data-layer.prabhavalabs.com (certbot rewrites this
# file in place with the TLS server block).
server {
    server_name lanka-data-layer.prabhavalabs.com;

    root /opt/lanka-data-layer/web-dist;
    index index.html;

    # If Cloudflare is proxying (orange cloud), restore the real client IP
    # so the per-IP limits key on actual clients, not Cloudflare's edges.
    # The header is only trusted when the connection comes from a Cloudflare
    # range, so this is inert while the DNS record stays grey-cloud.
    # Ranges: https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Over-limit responses keep the API's envelope shape so clients can
    # parse every response the same way.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"success":false,"message":"rate limit exceeded, slow down","payload":null,"meta":{}}';
    }

    # Tiles — chattiest legitimate traffic (PMTiles range requests arrive in
    # bursts while panning); looser dedicated zone. Longest-prefix match
    # wins, so this takes precedence over /v1/.
    location /v1/tiles/ {
        limit_req zone=lanka_tiles burst=120 nodelay;
        limit_req_status 429;
        limit_conn lanka_conn 30;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # API — container bound to loopback (infra/docker-compose.yml).
    location /v1/ {
        limit_req zone=lanka_api burst=40 nodelay;
        limit_req_status 429;
        limit_conn lanka_conn 30;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Static SPA — hashed assets cache forever, index.html revalidates.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri /index.html;
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen 80;
    listen [::]:80;
}
