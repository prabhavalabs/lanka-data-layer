# Rate-limit zones for the lanka-data-layer public API.
# Install to /etc/nginx/conf.d/lanka-data-layer-limits.conf (http context —
# zones must live outside the vhost; the vhost's location blocks reference
# them with limit_req/limit_conn).
#
# Sizing: the API is precomputed indexed reads behind ETag/304 caching, so
# these limits exist to stop abuse and accidental hammering, not to meter
# normal use. A map session is the chattiest legitimate client — PMTiles
# range requests arrive in bursts of dozens per zoom gesture — so tiles get
# their own, much looser zone instead of inflating the general API budget.
# 10m of zone memory holds ~160k distinct client IPs; nginx evicts oldest
# entries under pressure rather than failing.

# General API: 10 req/s sustained per client, bursts to 40 absorbed
# without queuing delay (nodelay), beyond that 429.
limit_req_zone $binary_remote_addr zone=lanka_api:10m rate=10r/s;

# Tiles: range requests are cheap sendfile reads and browsers fire many at
# once while panning/zooming.
limit_req_zone $binary_remote_addr zone=lanka_tiles:10m rate=40r/s;

# Concurrent-connection cap per client (slowloris / parallel-download guard).
limit_conn_zone $binary_remote_addr zone=lanka_conn:10m;
