# Lanka Data Layer v2 — PostgreSQL 18 tuning for the production VPS
# (8 vCPU / 15 GB RAM / NVMe), shared with the Rust server, the v1 Hono api
# and nightly ingest/build jobs. Postgres is budgeted ~6-7 GB (compose caps
# the container at 7 GB); the rest stays OS page cache for the raw archive,
# memory-mapped grid arrays and builds.
#
# Workload: read-heavy indexed lookups (API) plus bursty bulk COPY loads
# (ingestion). Few rows per request, large batch writes.

# ── connections ─────────────────────────────────────────────────────────────
listen_addresses = '*'            # container-internal; host port is 127.0.0.1-only
port = 5432
max_connections = 80              # server pool 32 + ingest 8 + admin headroom
superuser_reserved_connections = 3
password_encryption = scram-sha-256

# ── memory ──────────────────────────────────────────────────────────────────
shared_buffers = 3GB              # ~20% of host RAM; hot set is a few hundred MB
effective_cache_size = 9GB        # shared_buffers + expected OS page cache
work_mem = 32MB                   # per sort/hash node; API queries are tiny
hash_mem_multiplier = 2.0
maintenance_work_mem = 1GB        # index builds after bulk loads
autovacuum_work_mem = 256MB
huge_pages = try
temp_buffers = 32MB

# ── I/O (NVMe) ──────────────────────────────────────────────────────────────
random_page_cost = 1.1
seq_page_cost = 1.0
effective_io_concurrency = 200
maintenance_io_concurrency = 200
io_method = worker                # PG18 asynchronous I/O
io_workers = 4

# ── WAL / checkpoints (bulk-COPY friendly) ──────────────────────────────────
wal_level = replica               # keeps PITR / pg_basebackup possible
wal_compression = zstd
wal_buffers = 64MB
max_wal_size = 8GB
min_wal_size = 1GB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9

# ── parallelism ─────────────────────────────────────────────────────────────
max_worker_processes = 12
max_parallel_workers = 6
max_parallel_workers_per_gather = 3
max_parallel_maintenance_workers = 3

# ── planner ─────────────────────────────────────────────────────────────────
default_statistics_target = 200
jit = off                         # sub-ms lookups; JIT only adds latency
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# ── autovacuum (append-mostly tables, large batch inserts) ──────────────────
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_insert_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 2000

# ── observability ───────────────────────────────────────────────────────────
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on
track_wal_io_timing = on
log_destination = 'stderr'
logging_collector = off           # docker captures stderr
log_min_duration_statement = 250ms
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_lock_waits = on
log_temp_files = 64MB
log_line_prefix = '%m [%p] %q%u@%d app=%a '

# ── locale / misc ───────────────────────────────────────────────────────────
timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, ymd'
default_text_search_config = 'pg_catalog.simple'
idle_in_transaction_session_timeout = 60s
# statement_timeout stays 0 globally; the server sets 5s per session.
