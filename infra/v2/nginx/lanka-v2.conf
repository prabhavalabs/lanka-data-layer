# Lanka Data Layer v2 — host nginx (07 §1, §5.3). Include from the server
# block of the public vhost (TLS by certbot). deploy.sh rewrites
# /etc/nginx/lanka-v2-upstream.conf to switch blue (8601) ↔ green (8611).
#
#   /etc/nginx/lanka-v2-upstream.conf:   server 127.0.0.1:8601;

# http {} level (conf.d):
#   upstream lanka_v2 { include /etc/nginx/lanka-v2-upstream.conf; keepalive 16; }
#   limit_req_zone $binary_remote_addr zone=lanka_api:10m rate=20r/s;
#   limit_req_zone $binary_remote_addr zone=lanka_heavy:10m rate=5r/s;
#   limit_conn_zone $binary_remote_addr zone=lanka_dl:10m;
#   proxy_cache_path /var/cache/nginx/lanka levels=1:2 keys_zone=lanka:64m max_size=4g inactive=7d use_temp_path=off;

location /v2/ {
    limit_req zone=lanka_api burst=60 nodelay;
    proxy_pass http://lanka_v2;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache lanka;
    proxy_cache_revalidate on;
    proxy_cache_use_stale error timeout updating http_502 http_503;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status always;
}

# Health and status are never cached (the engine also sends no-store).
location ~ ^/v2/(health|status) {
    proxy_pass http://lanka_v2;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
}

location /v2/data {
    limit_req zone=lanka_heavy burst=20 nodelay;
    proxy_pass http://lanka_v2;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_cache lanka;
}

# Bulk downloads straight from the store: published subtrees only.
location ~ ^/dl/((datasets|releases|tiles)/.+)$ {
    alias /srv/lanka/store/$1;
    limit_conn lanka_dl 4;
    limit_rate_after 50m;
    limit_rate 5m;
}
location /dl/ { return 404; }
