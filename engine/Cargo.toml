[workspace]
resolver = "3"
members = [
  "crates/lanka-core",
  "crates/lanka-store",
  "crates/lanka-ingest",
  "crates/lanka-enrich",
  "crates/lanka-mapdoc",
  "crates/lanka-app",
  "crates/lanka-grid",
  "crates/lanka-server",
  "crates/lanka-cli",
  "crates/lanka-export",
  "crates/lanka-stats",
  "crates/lanka-stats-wasm",
  "crates/lanka-analysis",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/prabhavalabs/lanka-data-layer"
publish = false

[workspace.dependencies]
lanka-app = { path = "crates/lanka-app" }
lanka-core = { path = "crates/lanka-core" }
lanka-export = { path = "crates/lanka-export" }
lanka-ingest = { path = "crates/lanka-ingest" }
lanka-enrich = { path = "crates/lanka-enrich" }
lanka-mapdoc = { path = "crates/lanka-mapdoc" }
lanka-grid = { path = "crates/lanka-grid" }
lanka-store = { path = "crates/lanka-store" }
lanka-server = { path = "crates/lanka-server" }
lanka-stats = { path = "crates/lanka-stats" }
lanka-analysis = { path = "crates/lanka-analysis" }

anyhow = "=1.0.104"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "fs", "time", "sync", "io-util", "net"] }
futures = "=0.3.34"
bytes = "=1.12.2"
async-trait = "=0.1.89"
arrow-array = "=60.0.0"
arrow-schema = "=60.0.0"
arrow-ipc = "=60.0.0"
parquet = { version = "=60.0.0", default-features = false, features = ["arrow", "zstd"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
serde_yaml_ng = "=0.10.0"
jsonschema = { version = "=0.62.0", default-features = false }
sqlx = { version = "=0.9.1", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "json", "chrono"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std", "clock", "serde"] }
axum = { version = "=0.8.9", features = ["macros"] }
tower-http = { version = "=0.7.1", features = ["compression-gzip", "compression-br", "trace", "cors", "timeout"] }
utoipa = { version = "=6.0.0", features = ["axum_extras", "chrono"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "gzip", "json", "stream"] }
sha2 = "=0.11.1"
hex = "=0.4.3"
ryu = "=1.0.23"
calamine = "=0.38.0"
clap = { version = "=4.6.9", features = ["derive", "env"] }
nix = { version = "=0.32.0", default-features = false, features = ["fs"] }
tracing = "=0.1.44"
memmap2 = "=0.9.12"
tiff = { version = "=0.11.3", default-features = false, features = ["deflate", "lzw"] }
png = "=0.18.1"
flate2 = "=1.1.11"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json", "fmt"] }
# WP-04: OSM PBF reading (pure Rust, rust zlib backend) and gzip for PMTiles directories
osmpbf = { version = "=0.3.8", default-features = false, features = ["rust-zlib"] }
rayon = "=1.12.0"
# WP-29: pure-Rust maths for bit-identical native/WASM statistics; zip CRCs for result bundles
libm = "=0.2.16"
crc32fast = "=1.5.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[workspace.lints.rust]
# `deny`, not `forbid`: lanka-grid/src/mmap.rs is the one audited exception (ADR 0013).
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
