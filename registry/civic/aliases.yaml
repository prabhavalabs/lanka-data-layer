# Institution aliases (13 §2.1, track C1).
#
# Maps a reworded or renamed institution to one entity key, so the same body
# keeps one continuous history across gazettes. Left side: the name as a
# gazette words it (or its key). Right side: the name or key to merge it into,
# normally the current wording. The key rules are applied to both sides
# (lower-case, `Ltd`/`(Pvt)` as `limited`, line-wrap hyphens joined), so a
# difference of that kind needs no entry. A target must not itself be an alias.
# After a change run `lanka civic build`.
#
# Found by comparing Gazette Extraordinary 2403/53 (2024-09-27) with 2412/08
# (2024-11-25): the same body, worded differently.

# the company's name abbreviated in 2412/08
"Colombo Lotus Tower Management Company (Pvt) Limited": "Colombo Lotus Tower Management Co. (Pvt.) Ltd"
# "of Sri Lanka" added
"Credit Information Bureau": "Credit Information Bureau of Sri Lanka"
# renamed: "National" dropped
"Department of National Community Water Supply": "Department of Community Water Supply"
# 2412/08 prints "Person" (typo); the right spelling is the key
"Department of Registration of Person": "Department of Registration of Persons"
# 2412/08 prints "MedicalCouncil" (typo); the right spelling is the key
"Homeopathy MedicalCouncil": "Homeopathy Medical Council"
# renamed: "National" added
"Institute of Post-Harvest Management": "National Institute of Post-Harvest Management"
# spaced differently in 2412/08
"Northsea Ltd": "North sea Ltd"
# renamed: "National" added, "Organization" singular
"Secretariat for Non-Governmental Organizations": "National Secretariat for Non-Governmental Organization"

