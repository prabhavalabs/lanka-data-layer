# nuuuwan/lk_dcs: DCS CCPI releases parsed into TSV, one dated folder per release. The
# newest "movements of the CCPI core" table carries the whole monthly history since 2022;
# its year-on-year inflation columns are ratios (0.506 = 50.6 %), scaled to percent.
# The repository commit is the fingerprint (no change → nothing fetched). Third-party parse
# of DCS PDFs: the DCS PDF parser (WP-08) remains the primary path; this is the
# machine-readable cross-check named in the source notes. Licence permission_unclear:
# published with attribution and the takedown contact (08 §2).
source: nuuuwan-lk-dcs
driver: git_files
version: 1.1.0
description: CCPI index by group and headline and core year-on-year inflation from nuuuwan/lk_dcs (TSV at a commit).
discover:
  kind: git
  repo: nuuuwan/lk_dcs
  ref: main
  links:
    - { key: ccpi_core, pattern: "^data/ccpi/movements-of-the-ccpi-core/\\d{4}/(\\d{4}-\\d{2}-\\d{2})/data\\.tsv$" }
    # CCPI (2021=100) by group: all items, food, non-food and the 11 non-food divisions.
    - { key: ccpi_sub, pattern: "^data/ccpi/ccpi-by-subgroup/\\d{4}/(\\d{4}-\\d{2}-\\d{2})/data\\.tsv$" }
extract:
  format: tsv
standardise:
  dataset: dcs-ccpi
  tables:
    - { id: ccpi, artifact: ^ccpi_core$ }
    - { id: ccpi_sub, artifact: ^ccpi_sub$ }
  outputs:
    - table: ccpi
      method: csv_row
      indicator: { value: econ.cpi.ccpi_yoy }
      geo: { root: true }
      period: &month { column: date_str, freq: M, parse: "%Y-%m-%d" }
      value: { column: inflation_ccpi_year_to_year, number: { scale: 100 } }
    - table: ccpi
      method: csv_row
      indicator: { value: econ.cpi.ccpi_core_yoy }
      geo: { root: true }
      period: *month
      value: { column: inflation_ccpi_core_year_to_year, number: { scale: 100 } }
    # DCS CCPI groups are COICOP 1999 divisions; communication (08) and miscellaneous
    # goods and services (12 in COICOP 1999) map to the nearest COICOP 2018 division.
    - table: ccpi_sub
      method: csv_row
      indicator: { value: econ.cpi.ccpi_index }
      melt: { columns: "_ccpi$" }
      geo: { root: true }
      period: { column: date_str, freq: M, parse: "%Y-%m-%d" }
      dims:
        coicop_group:
          melt: true
          map:
            all_ccpi: total
            food_ccpi: food
            non-food_ccpi: nonfood
            alcoholic-beverages-and-tobacco_ccpi: "02"
            clothing-and-footwear_ccpi: "03"
            housing-water-electricity-gas-and-other-fuels_ccpi: "04"
            furnishings-household-equipment-and-routine-household-maintenance_ccpi: "05"
            health_ccpi: "06"
            transport_ccpi: "07"
            communication_ccpi: "08"
            recreation-and-culture_ccpi: "09"
            education_ccpi: "10"
            restaurants-and-hotels_ccpi: "11"
            miscellaneous-goods-and-services_ccpi: "13"
      value: { number: { missing: [""] } }
expect:
  - { check: range, indicator: econ.cpi.ccpi_yoy, min: -20, max: 100 }
  - { check: range, indicator: econ.cpi.ccpi_core_yoy, min: -20, max: 100 }
  - { check: range, indicator: econ.cpi.ccpi_index, min: 50, max: 600 }
  - { check: no_future }
  - { check: period_continuity }
  - { check: row_count, min: 600 }
