expect:
  - { dataset: dcs-lfs-annual-subnational, check: range, indicator: lab.lfpr_annual, min: 15, max: 90 }
  - { dataset: dcs-lfs-annual-subnational, check: range, indicator: lab.unemployment_rate_sub, min: 0, max: 30 }
  - dataset: dcs-lfs-annual-subnational
    check: sql
    note: The 17 LFS industry groups sum to the total employed (Abstract persons ±3; Pocket Book thousands ±12 000).
    query: >-
      SELECT g.period_start, sum(g.value) AS groups, t.value AS total
      FROM stage_obs g JOIN stage_obs t ON t.period_start = g.period_start AND t.indicator_id = g.indicator_id
      AND t.geo_code = g.geo_code AND t.dims = 'industry=total'
      WHERE g.indicator_id = 'lab.employment_by_industry'
      AND g.dims NOT IN ('industry=total', 'industry=agriculture', 'industry=industry', 'industry=services')
      GROUP BY g.period_start, t.value HAVING abs(sum(g.value) - t.value) > 12000
  - dataset: dcs-lfs-annual-subnational
    check: sql
    note: Employed + unemployed = labour force (±2 persons), per sex.
    query: >-
      SELECT e.period_start, e.value + u.value AS sum, l.value AS lf
      FROM stage_obs e JOIN stage_obs u ON u.period_start = e.period_start AND u.indicator_id = 'lab.unemployed_annual'
      AND u.dims = e.dims
      JOIN stage_obs l ON l.period_start = e.period_start AND l.indicator_id = 'lab.labour_force_annual' AND l.dims = e.dims
      WHERE e.indicator_id = 'lab.employed_annual' AND e.geo_code = 'LK' AND u.geo_code = 'LK' AND l.geo_code = 'LK'
      AND abs(e.value + u.value - l.value) > 2
  - { dataset: dcs-lfs-annual-subnational, check: range, indicator: lab.informal_share, min: 10, max: 90 }
  - { dataset: dcs-lfs-annual-subnational, check: completeness, indicator: lab.informal_share, level: 2, min_units: 25 }
  - { dataset: dcs-lfs-annual-subnational, check: completeness, indicator: lab.unemployment_rate_sub, level: 1, min_units: 9 }
  - dataset: dcs-lfs-annual-subnational
    check: sql
    note: The ten occupation groups sum to the total employed (thousands, ±20 000 persons).
    query: >-
      SELECT g.period_start, sum(g.value) AS groups, t.value AS total
      FROM stage_obs g JOIN stage_obs t ON t.period_start = g.period_start AND t.indicator_id = g.indicator_id
      AND t.dims = 'occupation=total'
      WHERE g.indicator_id = 'lab.employment_by_occupation' AND g.dims <> 'occupation=total'
      GROUP BY g.period_start, t.value HAVING abs(sum(g.value) - t.value) > 20000
  - { dataset: dcs-lfs-annual-subnational, check: no_future }
  - { dataset: dcs-lfs-quarterly, check: range, indicator: lab.lfpr, min: 20, max: 90 }
  - { dataset: dcs-lfs-quarterly, check: range, indicator: lab.unemployment_rate, min: 0, max: 30 }
