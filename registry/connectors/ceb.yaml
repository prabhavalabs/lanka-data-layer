# Ceylon Electricity Board, Statistical Digest 2025 (web edition): sales, consumer accounts and
# revenue by CEB distribution region ("Distribution Provinces as per CEB Classification") and by
# tariff category, two years per table (2024, 2025). Text-layer PDF read through registry
# templates (registry/templates/ceb/); every template checks its printed subtotals (regions to
# Distribution Division totals, divisions + LECO bulk to the grand total, tariff sub-categories
# to category totals). Class B: every version is reviewed against its evidence sheet.
# One quantity's grand total is printed in both its region and its tariff table; it is read
# from the region table only (both map to ceb_region = total, tariff_category = total).
# Street lighting is one account in the region table and an estimated sales figure in the
# tariff table; both are kept under their own row.
# Licence permission_unclear: published with attribution and the takedown contact (08 §2).
source: ceb
driver: pdf_table
version: 1.0.0
description: >-
  CEB Statistical Digest: consumer accounts, sales and revenue by distribution region and tariff.
  Class B: every version is reviewed against its evidence sheet before release.
discover:
  files:
    - key: ceb-sd-2025
      url: "https://ceb.lk/front_img/img_reports/1783568926SD-2025-Finalized-(Web-Edition).pdf"
      edition: "2025"
extract:
  tables:
    - { id: sales_region, file: ceb-sd-2025, template: ceb/sales-by-region }
    - { id: accounts_region, file: ceb-sd-2025, template: ceb/accounts-by-region }
    - { id: revenue_region, file: ceb-sd-2025, template: ceb/revenue-by-region }
    - { id: sales_tariff, file: ceb-sd-2025, template: ceb/sales-by-tariff }
    - { id: accounts_tariff, file: ceb-sd-2025, template: ceb/accounts-by-tariff }
    - { id: revenue_tariff, file: ceb-sd-2025, template: ceb/revenue-by-tariff }
standardise:
  dataset: ceb-statistical-digest
  vintage: "CEB Statistical Digest {edition}"
  outputs:
