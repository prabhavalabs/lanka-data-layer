  - { check: sum_dims, dim: ceb_region, tol_pct: 0.2, note: "regions add up to their Distribution Division and the grand total (printed, rounded)" }
  - { check: sum_dims, dim: tariff_category, tol_pct: 0.2, note: "sub-categories add up to category totals and categories to the grand total" }
