# nuuuwan/lk_metro: a community proposal for a Colombo "Lanka Metro" bus network (8 routes CM01…, 111 stops).
# data/stops.json lists every stop with its road and [lat, lng]; the repository commit is the fingerprint.
# Only the stops are published: the routes (data/routes.json) are ordered lists of stop names, and turning them
# into lines needs a geometry step the declarative drivers do not have. Licence MIT (attribution).
source: nuuuwan-lk-metro
driver: git_files
version: 1.0.0
description: Proposed Lanka Metro stops (nuuuwan/lk_metro data/stops.json at a commit).
discover:
  kind: git
  repo: nuuuwan/lk_metro
  ref: main
  files:
    - { key: stops, path: data/stops.json }
extract:
  format: json
  tables:
    - { id: stops, path: "$", fields: { name: name, road: road, lat: "latlng[0]", lng: "latlng[1]" } }
standardise:
  dataset: lk-metro-proposed-lines
  tables:
    - { id: stops, artifact: ^stops$ }
  outputs:
    - table: stops
      feature:
        key: name
        kind: { value: stop }
        name: name
        lon: lng
        lat: lat
        attrs:
          road: road
expect:
  - { check: geometry, valid: true, within_bbox: [79.7, 6.6, 80.2, 7.3] }
  - { check: row_count, min: 100, max: 200 }
