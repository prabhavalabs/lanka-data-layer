# Statistical Pocket Book (DCS), social chapters. The publication page serves the PDF itself.
# Class B: every version is reviewed against its evidence sheet. Licence permission_unclear:
# published with attribution and the takedown contact (08 §2).
#
# HIES survey periods are keyed by their first year (2012/13 -> 2012). Poverty indices carry the
# poverty line vintage as a dimension: the old official line (2002 base) for every round, and the
# updated line (2012/13 base) for 2019 only.
source: dcs-pocketbook-social
driver: pdf_table
version: 1.0.0
description: Statistical Pocket Book social tables (poverty, income, expenditure, vital statistics).
discover:
  files:
    - key: pocketbook-2026
      url: http://www.statistics.gov.lk/Publication/PocketBook2026
      edition: "2026"
    # Statistical Abstract table 4.6 (district poverty headcount) feeds the same dataset; one
    # connector per dataset, because a version replaces the dataset's open rows.
    - key: abstract-2025-4.6
      url: http://www.statistics.gov.lk/abstract2025/CHAP4/4.6.pdf
      edition: "2025"
extract:
  tables:
    - { id: t2_7, file: pocketbook-2026, template: dcs-pocketbook-social/table-2.7-vital-statistics }
    - { id: t4_3, file: pocketbook-2026, template: dcs-pocketbook-social/table-4.3-poverty-headcount-sector }
    - { id: t4_4, file: pocketbook-2026, template: dcs-pocketbook-social/table-4.4-household-income-gini-sector }
    - { id: t4_5, file: pocketbook-2026, template: dcs-pocketbook-social/table-4.5-poverty-gap-sector }
    - { id: t4_6, file: pocketbook-2026, template: dcs-pocketbook-social/table-4.6-household-food-expenditure }
    - { id: t4_7, file: pocketbook-2026, template: dcs-pocketbook-social/table-4.7-household-nonfood-expenditure }
    - { id: a4_6, file: abstract-2025-4.6, template: dcs-statistical-abstract/table-4.6-poverty-headcount-district }
    - { id: t2_10, file: pocketbook-2026, template: dcs-pocketbook-social/table-2.10-disaster-affected }
    - { id: t2_11, file: pocketbook-2026, template: dcs-pocketbook-social/table-2.11-disaster-deaths }
    - { id: t12_1, file: pocketbook-2026, template: dcs-pocketbook-social/table-12.1-government-health-services }
    - { id: t13_1, file: pocketbook-2026, template: dcs-pocketbook-social/table-13.1-school-resources }
    - { id: t13_2, file: pocketbook-2026, template: dcs-pocketbook-social/table-13.2-exam-results }
    - { id: t15_2, file: pocketbook-2026, template: dcs-pocketbook-social/table-15.2-local-government-services }
standardise:
  dataset: dcs-hies-poverty
  vintage: "Statistical Pocket Book 2026; Statistical Abstract 2025"
  outputs:
    # ── 4.3 poverty headcount index and poor households by sector ───────────────────
    # The all-island headcount comes from Abstract 4.6 (same values, longer series), except the
    # 2019 old-line figure, which only the Pocket Book prints.
    - table: t4_3
      indicator: pov.headcount_ratio
      geo: { fixed: root }
      period: { from_header: year }
      rows:
        Urban: { sector: urban }
        Rural: { sector: rural }
        Estate: { sector: estate }
      columns:
        hci_2006: { poverty_line: base_2002 }
        hci_2009: { poverty_line: base_2002 }
        hci_2012: { poverty_line: base_2002 }
        hci_2016: { poverty_line: base_2002 }
        hci_2019: { poverty_line: base_2002 }
        hci_2019_updated: { poverty_line: base_2012 }
    - table: t4_3
      indicator: pov.headcount_ratio
      geo: { fixed: root }
      period: { from_header: year }
      rows: { All Island: { sector: total } }
      columns: { hci_2019: { poverty_line: base_2002 } }
    - table: t4_3
      indicator: pov.poor_households_pct
      geo: { fixed: root }
      period: { from_header: year }
      rows: &sectors
        All Island: { sector: total }
        Urban: { sector: urban }
        Rural: { sector: rural }
        Estate: { sector: estate }
      columns:
        hh_2006: { poverty_line: base_2002 }
        hh_2009: { poverty_line: base_2002 }
        hh_2012: { poverty_line: base_2002 }
        hh_2016: { poverty_line: base_2002 }
        hh_2019: { poverty_line: base_2002 }
        hh_2019_updated: { poverty_line: base_2012 }
    # Abstract 4.6: district headcount, 1995/96-2019 (old line to 2016, updated line in 2019);
    # "-" = not surveyed (Northern and Eastern provinces before 2012/13).
    - table: a4_6
      indicator: pov.headcount_ratio
      geo: { from_label: { level: 2, root: ["Sri Lanka"] } }
      period: { from_header: year }
      columns:
        p1995: { sector: total, poverty_line: base_2002 }
        p2002: { sector: total, poverty_line: base_2002 }
        p2006: { sector: total, poverty_line: base_2002 }
        p2009: { sector: total, poverty_line: base_2002 }
        p2012: { sector: total, poverty_line: base_2002 }
        p2016: { sector: total, poverty_line: base_2002 }
        p2019: { sector: total, poverty_line: base_2012 }
    # ── 4.5 poverty gap and squared poverty gap by sector ───────────────────────────
    - table: t4_5
      indicator: pov.poverty_gap
      geo: { fixed: root }
      period: { from_header: year }
      rows: *sectors
      columns:
        pg_2012: { poverty_line: base_2002 }
        pg_2016: { poverty_line: base_2002 }
        pg_2019: { poverty_line: base_2002 }
        pg_2019_updated: { poverty_line: base_2012 }
    - table: t4_5
      indicator: pov.squared_gap
      geo: { fixed: root }
      period: { from_header: year }
      rows: *sectors
      columns:
        spg_2012: { poverty_line: base_2002 }
        spg_2016: { poverty_line: base_2002 }
        spg_2019: { poverty_line: base_2002 }
        spg_2019_updated: { poverty_line: base_2012 }
    # ── 4.4 household income and Gini by sector ─────────────────────────────────────
    - table: t4_4
      dataset: dcs-hies-income-expenditure
      indicator: hies.mean_household_income
      geo: { fixed: root }
      period: { from_header: year }
      rows: *sectors
      columns: { inc_2006: {}, inc_2009: {}, inc_2012: {}, inc_2016: {}, inc_2019: {} }
    - table: t4_4
      dataset: dcs-hies-income-expenditure
      indicator: hies.gini_income
      geo: { fixed: root }
      period: { from_header: year }
      rows: *sectors
      columns: { gini_2006: {}, gini_2009: {}, gini_2012: {}, gini_2016: {}, gini_2019: {} }
    # ── 4.6 food items, 4.7 non-food groups ─────────────────────────────────────────
    - table: t4_6
      dataset: dcs-hies-income-expenditure
      indicator: hies.food_item_expenditure
      geo: { fixed: root }
      period: { from_header: year }
      rows: &food
        Rice: { item: rice }
        Wheat flour: { item: wheat_flour }
        Bread: { item: bread }
        Condiments: { item: condiments }
        Pulses: { item: pulses }
        Vegetables: { item: vegetables }
        Coconut: { item: coconut }
        Meat: { item: meat }
        Fish: { item: fish }
        Dried Fish: { item: dried_fish }
        Milk: { item: milk }
        Milk products: { item: milk_products }
        Eggs: { item: eggs }
        Fruit: { item: fruit }
        Sugar: { item: sugar }
        Other food & drink: { item: other_food_drink }
      columns: { value_2012: {}, value_2016: {}, value_2019: {} }
    - table: t4_6
      dataset: dcs-hies-income-expenditure
      indicator: hies.food_item_quantity
      geo: { fixed: root }
      period: { from_header: year }
      rows: *food
      columns: { qty_2012: {}, qty_2016: {}, qty_2019: {} }
    - table: t4_7
      dataset: dcs-hies-income-expenditure
      indicator: hies.nonfood_expenditure
      geo: { fixed: root }
      period: { from_header: year }
      rows:
        Housing: { group: housing }
        Fuel and Light: { group: fuel_light }
        Clothing and Textile and Footwear: { group: clothing }
        Personal Care and Health: { group: personal_care_health }
        Transport and Communication: { group: transport_communication }
        Education: { group: education }
        Cultural and Entertainment: { group: culture_entertainment }
        Non-durable Household Goods: { group: nondurable_goods }
        Consumer Durables: { group: consumer_durables }
        Other Non-Consumer Expenditure: { group: other_non_consumer }
        Liquor and Tobacco: { group: liquor_tobacco }
      columns: { e2009: {}, e2012: {}, e2016: {}, e2019: {} }
    # ── 2.7 vital statistics ────────────────────────────────────────────────────────
    - { table: t2_7, dataset: dcs-vital-statistics, indicator: vital.crude_birth_rate, geo: { fixed: root },
        period: { from_label: year }, columns: { birth_rate: {} }, status: { label_markers: { "*": provisional } } }
    - { table: t2_7, dataset: dcs-vital-statistics, indicator: vital.crude_death_rate, geo: { fixed: root },
        period: { from_label: year }, columns: { death_rate: {} }, status: { label_markers: { "*": provisional } } }
    - { table: t2_7, dataset: dcs-vital-statistics, indicator: vital.maternal_mortality_ratio, geo: { fixed: root },
        period: { from_label: year }, columns: { mmr: {} }, status: { label_markers: { "*": provisional } } }
    - { table: t2_7, dataset: dcs-vital-statistics, indicator: vital.under5_mortality_rate, geo: { fixed: root },
        period: { from_label: year }, columns: { u5mr: {} }, status: { label_markers: { "*": provisional } } }
    - { table: t2_7, dataset: dcs-vital-statistics, indicator: vital.infant_mortality_rate, geo: { fixed: root },
        period: { from_label: year }, columns: { imr: {} }, status: { label_markers: { "*": provisional } } }
    # ── P2 social services: 12.1 health, 13.1 schools, 13.2 exams, 15.2 local services,
    #    2.10 / 2.11 natural disasters ────────────────────────────────────────────────
    - { table: t12_1, dataset: dcs-pocketbook-social-services, indicator: pb.health_institutions, geo: { fixed: root }, period: { from_label: year },
        columns: { hospitals: { type: total } }, status: { label_markers: { "*": provisional } } }
    - { table: t12_1, dataset: dcs-pocketbook-social-services, indicator: pb.hospital_beds, geo: { fixed: root }, period: { from_label: year },
        columns: { beds: {} }, status: { label_markers: { "*": provisional } } }
    - { table: t12_1, dataset: dcs-pocketbook-social-services, indicator: pb.central_dispensaries, geo: { fixed: root }, period: { from_label: year },
        columns: { dispensaries: {} }, status: { label_markers: { "*": provisional } } }
    - { table: t12_1, dataset: dcs-pocketbook-social-services, indicator: pb.doctors, geo: { fixed: root }, period: { from_label: year },
        columns: { doctors: {} }, status: { label_markers: { "*": provisional } } }
    - { table: t12_1, dataset: dcs-pocketbook-social-services, indicator: pb.registered_amps, geo: { fixed: root }, period: { from_label: year },
        columns: { amp: {} }, status: { label_markers: { "*": provisional } } }
    - { table: t12_1, dataset: dcs-pocketbook-social-services, indicator: pb.nurses, geo: { fixed: root }, period: { from_label: year },
        columns: { nurses: {} }, status: { label_markers: { "*": provisional } } }
    - { table: t12_1, dataset: dcs-pocketbook-social-services, indicator: pb.outpatient_visits, geo: { fixed: root }, period: { from_label: year },
        columns: { outpatients_k: {} }, scale: 1000, status: { label_markers: { "*": provisional } } }
    - { table: t12_1, dataset: dcs-pocketbook-social-services, indicator: pb.inpatient_visits, geo: { fixed: root }, period: { from_label: year },
        columns: { inpatients_k: {} }, scale: 1000, status: { label_markers: { "*": provisional } } }
    - table: t13_1
      dataset: dcs-pocketbook-social-services
      indicator: pb.schools
      geo: { fixed: root }
      period: { from_header: year }
      rows:
        "Total Number of Schools": { school_type: total }
        "Government Schools#1": { school_type: government }
        "Government approved Private Schools#1": { school_type: private_approved }
        "Special Schools#1": { school_type: special }
        "Piriven#1": { school_type: piriven }
      columns: { y1: {}, y2: {}, y3: {}, y4: {} }
    - table: t13_1
      dataset: dcs-pocketbook-social-services
      indicator: pb.teachers
      geo: { fixed: root }
      period: { from_header: year }
      rows:
        "Total Number of Teachers": { school_type: total }
        "Government Schools#2": { school_type: government }
        "Government approved Private Schools#2": { school_type: private_approved }
        "Special Schools#2": { school_type: special }
        "Piriven#2": { school_type: piriven }
      columns: { y1: {}, y2: {}, y3: {}, y4: {} }
    - table: t13_1
      dataset: dcs-pocketbook-social-services
      indicator: pb.pupils
      geo: { fixed: root }
      period: { from_header: year }
      rows:
        "Total Number of Pupils": { school_type: total }
        "Government Schools#3": { school_type: government }
        "Government approved Private Schools#3": { school_type: private_approved }
        "Special Schools#3": { school_type: special }
        "Piriven#3": { school_type: piriven }
      columns: { y1: {}, y2: {}, y3: {}, y4: {} }
    - table: t13_1
      dataset: dcs-pocketbook-social-services
      indicator: pb.pupil_teacher_ratio
      geo: { fixed: root }
      period: { from_header: year }
      rows:
        "Government Schools#4": { school_type: government }
        "Government approved Private Schools#4": { school_type: private_approved }
        "Special Schools#4": { school_type: special }
        "Piriven#4": { school_type: piriven }
      columns: { y1: {}, y2: {}, y3: {}, y4: {} }
    - { table: t13_1, dataset: dcs-pocketbook-social-services, indicator: pb.new_admissions, geo: { fixed: root }, period: { from_header: year },
        rows: { "New Admissions to Government Schools": {} }, columns: { y1: {}, y2: {}, y3: {}, y4: {} } }
    - table: t13_2
      dataset: dcs-pocketbook-social-services
      indicator: pb.exam_candidates
      geo: { fixed: root }
      period: { from_header: year }
      rows:
        "School Candidates sat (5 or more Subjects ) for the GCE(O/L)": { stage: ol_school_sat }
        "All Candidates Sat (5 or more Subjects ) for the GCE(O/L)": { stage: ol_all_sat }
        "School Candidates sat for the GCE(A/L)": { stage: al_school_sat }
        "School Candidates Qualifying to Enter University": { stage: al_school_qualified_university }
        "All Candidates Applied for the GCE(A/L)": { stage: al_all_applied }
        "All Candidates Sat for the GCE(A/L)": { stage: al_all_sat }
        "All Candidates Qualifying to Enter University": { stage: al_all_qualified_university }
      columns: { y1: {}, y2: {} }
    - table: t13_2
      dataset: dcs-pocketbook-social-services
      indicator: pb.exam_qualifying_pct
      geo: { fixed: root }
      period: { from_header: year }
      rows:
        "Percentage Qualifying for GCE(A/L)#1": { stage: ol_school_qualified_al }
        "Percentage Qualifying for GCE(A/L)#2": { stage: ol_all_qualified_al }
        "Percentage Qualifying to Enter University#1": { stage: al_school_qualified_university }
        "Percentage Qualifying to Enter University#2": { stage: al_all_qualified_university }
      columns: { y1: {}, y2: {} }
    # 15.2 refers to 2024 (title year).
    - table: t15_2
      dataset: dcs-pocketbook-social-services
      indicator: pb.local_services
      geo: { fixed: root }
      period: { fixed: "2024" }
      rows:
        Dispensaries: { service: dispensaries }
        Cemeteries: { service: cemeteries }
        Parks and Playground: { service: parks_playgrounds }
        Libraries: { service: libraries }
      columns: &councils
        municipal: { council_type: municipal_council }
        urban: { council_type: urban_council }
        ps: { council_type: pradeshiya_sabha }
        total: { council_type: total }
    - { table: t15_2, dataset: dcs-pocketbook-social-services, indicator: pb.local_roads_km, geo: { fixed: root }, period: { fixed: "2024" },
        rows: { "Vehicular Road (Km)": {} }, columns: *councils }
    - table: t2_10
      dataset: dcs-pocketbook-social-services
      indicator: pb.disaster_affected
      geo: { fixed: root }
      period: { from_header: year }
      rows: &hazards
        Flood: { hazard: flood }
        Drought: { hazard: drought }
        Lightning (Thundering): { hazard: lightning }
        Strong Wind: { hazard: storm }
        Landslides: { hazard: landslide }
      columns: { y1: {}, y2: {}, y3: {}, y4: {} }
    - { table: t2_11, dataset: dcs-pocketbook-social-services, indicator: pb.disaster_deaths, geo: { fixed: root }, period: { from_header: year },
        rows: *hazards, columns: { y1: {}, y2: {}, y3: {}, y4: {} } }
expect:
  - { dataset: dcs-hies-poverty, check: range, min: 0, max: 100 }
  - { dataset: dcs-hies-poverty, check: row_count, min: 220, max: 225,
      note: "pocket book: 19 headcount + 24 poor-household + 31 gap cells (Estate 2019 old-line gap printed 1,2: missing);
        abstract 4.6: 182 district cells less 32 not surveyed" }
  - { dataset: dcs-hies-income-expenditure, check: range, indicator: hies.gini_income, min: 0.2, max: 0.7 }
  - { dataset: dcs-hies-income-expenditure, check: range, indicator: hies.mean_household_income, min: 10000, max: 200000 }
  - { dataset: dcs-hies-income-expenditure, check: monotonic, indicator: hies.mean_household_income, direction: increasing,
      note: "nominal income rises between rounds" }
  - { dataset: dcs-hies-income-expenditure, check: row_count, min: 160, max: 170,
      note: "20 income + 20 Gini + 48 food value + 33 food quantity + 44 non-food cells" }
  - { dataset: dcs-vital-statistics, check: range, indicator: vital.crude_birth_rate, min: 5, max: 40 }
  - { dataset: dcs-vital-statistics, check: range, indicator: vital.crude_death_rate, min: 3, max: 15 }
  - { dataset: dcs-vital-statistics, check: range, indicator: vital.infant_mortality_rate, min: 1, max: 50 }
  - { dataset: dcs-vital-statistics, check: row_count, min: 25, max: 40 }
  - { dataset: dcs-pocketbook-social-services, check: row_count, min: 240, max: 245,
      note: "health 80 + schools 80 + exams 22 + local services 20 + disasters 40" }
  - { dataset: dcs-pocketbook-social-services, check: sum_dims, indicator: pb.schools, dim: school_type, tol: 0 }
  - { dataset: dcs-pocketbook-social-services, check: sum_dims, indicator: pb.teachers, dim: school_type, tol: 0 }
  - { dataset: dcs-pocketbook-social-services, check: sum_dims, indicator: pb.pupils, dim: school_type, tol: 0 }
  - { dataset: dcs-pocketbook-social-services, check: sum_dims, indicator: pb.local_services, dim: council_type, tol: 0 }
  - { dataset: dcs-pocketbook-social-services, check: range, indicator: pb.exam_qualifying_pct, min: 0, max: 100 }
