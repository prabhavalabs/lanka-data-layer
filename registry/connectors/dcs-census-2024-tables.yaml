# Census of Population and Housing 2024 (DCS): housing and household workbooks served by the
# CPH2024 web pages. Licence permission_unclear: published with attribution and the takedown
# contact (08 §2); it does not block ingestion.
#
# - HH_DS_excel / OHU_DS_excel (BIFF .xls, read through calamine) and HH_GND_excel: one row per
#   DS / GN division with DCS province, district, DS and GN codes. These are the COD-AB p-code
#   digits: LK + district (2) + DS (2, zero-padded) + GN (3, zero-padded), so geography is a
#   code match, never a name match.
# - HousingA/A1-A8: district tables with trilingual (Sinhala / Tamil / English) labels and a
#   percentage row under every district (no label: dropped). Districts are name-matched from
#   the English tail of the label; column categories from the English tail of the header.
#
# Class B (irregular workbooks: merged three-row headers, trilingual labels, printed typos such
# as "Not relavent"). "Not relavent" in the housing tables counts the units whose structure is
# "Other" (non-conventional units); in the cooking table it counts households that do not cook.
#
# Boundary vintage: COD-AB carries the pre-2024 DS/GN layout. DS divisions created or re-coded since
# (Kothmale West, Mathurata, Walapane, Nildandahinna, Thalawakelle, Norwood, Wanduramba, Madampagama,
# Rathgama, Eravur Pattu, Eravur Town, Kalmunai, Kaltota) map to "" in the DS geo map and are dropped,
# never re-assigned. At GN level the GN rows of 18 re-delimited DS divisions (GN renumbered when the DS
# was split) are filtered out by DS name (a selection, not a join), plus 9 GN codes absent from COD-AB.
# Dropped rows stay in the archived workbook; they come back when the boundaries are updated.
#
# Transport: statistics.gov.lk offers only TLS 1.2 CBC suites (see dcs-agriculture), so the
# workbooks are fetched over plain HTTP; every artifact is content-addressed.
# Outputs are spelled out (the engine YAML reader has no merge keys).
source: dcs-census-2024-tables
driver: xlsx_table
version: 1.0.0
description: Census 2024 household and housing workbooks (DS and GN codes; district tables A1-A8).
discover:
  kind: static
  files:
  - {key: hh_ds, file: hh_ds.xls, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HH_DS_excel'}
  - {key: ohu_ds, file: ohu_ds.xls, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/OHU_DS_excel'}
  - {key: hh_gnd, file: hh_gnd.xlsx, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HH_GND_excel'}
  - {key: a1, file: a1.xlsx, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HousingA/A1'}
  - {key: a2, file: a2.xlsx, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HousingA/A2'}
  - {key: a3, file: a3.xlsx, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HousingA/A3'}
  - {key: a4, file: a4.xlsx, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HousingA/A4'}
  - {key: a5, file: a5.xlsx, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HousingA/A5'}
  - {key: a6, file: a6.xlsx, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HousingA/A6'}
  - {key: a7, file: a7.xlsx, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HousingA/A7'}
  - {key: a8, file: a8.xlsx, url: 'http://www.statistics.gov.lk/Population/StaticalInformation/CPH2024/HousingA/A8'}
extract: {format: xlsx}
standardise:
  dataset: dcs-census-2024-households
  tables:
  - id: hh_ds
    artifact: ^hh_ds$
    header: {anchor: ^Province, rows: 3, fill_right: true}
  - id: hh_gnd
    artifact: ^hh_gnd$
    header: {anchor: ^Province, rows: 3, fill_right: true}
  - id: ohu_ds
    artifact: ^ohu_ds$
    header: {anchor: ^Province, rows: 2, fill_right: true}
  - id: a1
    artifact: ^a1$
    header: {anchor: District\s*$, rows: 2, fill_right: true}
  - id: a2
    artifact: ^a2$
    header: {anchor: District\s*$, rows: 2, fill_right: true}
  - id: a3
    artifact: ^a3$
    header: {anchor: District\s*$, rows: 2, fill_right: true}
  - id: a4
    artifact: ^a4$
    header: {anchor: District\s*$, rows: 2, fill_right: true}
  - id: a5
    artifact: ^a5$
    header: {anchor: District\s*$, rows: 3, fill_right: true}
  - id: a6
    artifact: ^a6$
    header: {anchor: District\s*$, rows: 2, fill_right: true}
  - id: a7
    artifact: ^a7$
    header: {anchor: District\s*$, rows: 2, fill_right: true}
  - id: a8
    artifact: ^a8$
    header: {anchor: District\s*$, rows: 3, fill_right: true}
  outputs:
  - table: hh_ds
    indicator: {value: census24.households}
    geo:
      template: '{District Code}-0{DS_Division Code}'
      regex: ^(\d\d)-0*(\d\d)$
      replace: LK${1}${2}
      match: code
      level: 3
      unmapped: keep
      map: {LK2302: '', LK2307: '', LK2309: '', LK2310: '', LK2313: '', LK2314: '', LK3128: '', LK3135: '', LK3137: '', LK5112: '', LK5115: '',
        LK5224: '', LK9119: ''}
    period: {value: '2024', freq: A}
    value: {column: Number of Households}
  - table: hh_gnd
    indicator: {value: census24.households}
    geo:
      template: '{District Code}-0{DS_Division Code}-00{GN_Division Code}'
      regex: ^(\d\d)-0*(\d\d)-0*(\d\d\d)$
      replace: LK${1}${2}${3}
      match: code
      level: 4
      unmapped: keep
      map: {LK2206265: '', LK2215150: '', LK2218120: '', LK2221090: '', LK4415095: '', LK8215105: '', LK8218090: '', LK9103210: '', LK9103215: ''}
    filter:
    - column: DS_Division Name
      not_in: [Kothmale West, Mathurata, Walapane, Nildandahinna, Thalawakelle, Norwood, Baddegama, Wanduramba, Madampagama, Hikkaduwa, Rathgama,
        Eravur Pattu, Eravur Town, Kalmunai, Kuruvita, Balangoda, Kaltota, Galewela]
    period: {value: '2024', freq: A}
    value: {column: Number of Households}
  - table: hh_ds
    dataset: dcs-census-2024-basic-services
    indicator: {value: census24.hh_water_source}
    melt: {columns: '^Main Source/way of drinking water '}
    geo:
      template: '{District Code}-0{DS_Division Code}'
      regex: ^(\d\d)-0*(\d\d)$
      replace: LK${1}${2}
      match: code
      level: 3
      unmapped: keep
      map: {LK2302: '', LK2307: '', LK2309: '', LK2310: '', LK2313: '', LK2314: '', LK3128: '', LK3135: '', LK3137: '', LK5112: '', LK5115: '',
        LK5224: '', LK9119: ''}
    period: {value: '2024', freq: A}
    dims:
      water_source:
        melt: true
        regex: ^Main Source/way of drinking water (?:Ground Water|Pipe Borne water|Other) (.+)$
        map: {Protected well: protected_well, Semi protected well: semi_protected_well, Unprotected well: well_unprotected, Tube well: tube_well,
          Spring/ Fountain: spring, Pipe borne water - National water supply & drainage board: piped_nwsdb, Pipe borne water - Local Authority: piped_local_authority,
          Pipe borne water - Community base organiziation: piped_community, Pipe borne water - Private water supply project: piped_private, Tank/ River/Streams: surface_water,
          Rain water: rain_water, Bottled water: bottled_water, Filter water (R.O. Plant): filtered_ro, Bowser: bowser, Other (specify): other}
    value:
      number:
        missing: ['', '-']
