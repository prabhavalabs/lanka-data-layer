# OCHA COD-PS for Sri Lanka on HDX (CKAN): package_show → the newest CSV resource per
# admin level (the fingerprint is the resources' ids and last_modified stamps). Each CSV
# is wide: F_TL/M_TL/T_TL (all ages) and F_00_04 … T_80Plus; melted into sex × age.
source: hdx-cod-ps-lka
driver: ckan
version: 1.0.0
description: OCHA COD-PS population by sex and 5-year age band, ADM0-ADM2.
discover:
  kind: ckan
  package: https://data.humdata.org/api/3/action/package_show?id=cod-ps-lka
  resources:
    - { key: adm0, name: "^lka_admpop_adm0_\\d{4}\\.csv$", format: CSV }
    - { key: adm1, name: "^lka_admpop_adm1_\\d{4}\\.csv$", format: CSV }
    - { key: adm2, name: "^lka_admpop_adm2_\\d{4}\\.csv$", format: CSV }
standardise:
  dataset: cod-ps-lka-population
  tables:
    - { id: adm0, artifact: ^adm0$ }
    - { id: adm1, artifact: ^adm1$ }
    - { id: adm2, artifact: ^adm2$ }
  outputs:
    - table: adm0
      method: csv_row
      indicator: { value: pop.codps }
      melt: &cols { columns: "^[FMT]_(TL|\\d\\d_\\d\\d|80Plus)$" }
      geo: { column: ADM0_PCODE }
      period: &year { column: year, freq: A, parse: year }
      dims: &dims
        sex: { melt: true, regex: "^([FMT])_", map: { F: female, M: male, T: total } }
        age:
          melt: true
          regex: "^[FMT]_(.+)$"
          map: { TL: total, "00_04": "0-4", "05_09": "5-9", "10_14": "10-14", "15_19": "15-19", "20_24": "20-24",
                 "25_29": "25-29", "30_34": "30-34", "35_39": "35-39", "40_44": "40-44", "45_49": "45-49",
                 "50_54": "50-54", "55_59": "55-59", "60_64": "60-64", "65_69": "65-69", "70_74": "70-74",
                 "75_79": "75-79", 80Plus: "80+" }
      value: &num { number: { missing: [""] } }
    - { table: adm1, method: csv_row, indicator: { value: pop.codps }, melt: *cols, geo: { column: ADM1_PCODE }, period: *year, dims: *dims, value: *num }
    - { table: adm2, method: csv_row, indicator: { value: pop.codps }, melt: *cols, geo: { column: ADM2_PCODE }, period: *year, dims: *dims, value: *num }
expect:
  - { check: sum_to_parent, tol_pct: 0.5 }
  - { check: sum_dims, dim: sex, tol: 2 }
  - { check: completeness, level: 2, min_units: 25 }
  - { check: completeness, level: 1, min_units: 9 }
  - { check: range, min: 0, max: 30000000 }
