zonal:
  - indicator: haz.flood_area_share
    stat: mean
    cells: inside
    factor: 100
    layers: { "return_period=rp10": haz.flood_frac.rp10, "return_period=rp20": haz.flood_frac.rp20, "return_period=rp50": haz.flood_frac.rp50, "return_period=rp100": haz.flood_frac.rp100, "return_period=rp200": haz.flood_frac.rp200, "return_period=rp500": haz.flood_frac.rp500 }
