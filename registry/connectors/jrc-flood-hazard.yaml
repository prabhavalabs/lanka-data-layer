    source_res_m: 90
  - id: haz.flood_depth.rp200
    period: "2024"
    indicator: haz.flood_depth
    dims: return_period=rp200
    resample: centre_max
    files: [rp200-id186, rp200-id194]
    encoding: { dtype: u16, scale: 0.01, nodata: 65535 }
    unit: m
