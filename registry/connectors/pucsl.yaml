# Public Utilities Commission of Sri Lanka: SAIDI and SAIFI of the distribution licensees,
# one workbook per quarter (listed on https://www.pucsl.gov.lk/supply-quality/; file names are
# irregular, so the eight files are listed). Each licensee sheet (CEB Distribution Divisions
# 1-4, LECO) stacks two blocks, SAIDI then SAIFI: a header row (Province | Area | SAIDI),
# a year row, a month row, then one row per area office, CEB "Province" subtotal rows and a
# division total (CEB: label left of the Area column; LECO: in it).
# Internal headers conflict with the quarter the file is linked as (LECO 2025-Q1 prints
# "2024" and "January February September"; two 2025-Q2 sheets print no months; 2025-Q2 uses
# "Apr"), so months are read by column position within the quarter the file is published as
# (the link label, kept in the key), and the printed year/month rows are skipped. The header
# is the anchor row only (`min_width` covers the unlabelled month columns); the SAIFI block is
# the anchor's second occurrence.
# 2024-Q4 CEB sheets split each month into planned interruptions / breakdowns / other / total
# (dimension cause); every other file prints the total only.
# LECO 2025-Q1 prints SAIDI in hours per consumer per month: converted to minutes (× 60; the
# verbatim keeps the printed token).
# Region ("Province") subtotal rows are not published: regions are CEB groupings without a
# code list yet; area offices and licensee totals are. Class B (irregular workbooks).
# Licence permission_unclear: published with attribution and the takedown contact (08 §2).
source: pucsl
driver: xlsx_table
version: 1.0.0
description: PUCSL quarterly SAIDI and SAIFI by distribution licensee and area, monthly values.
