# WorldClim 2.1 historical climate (1970-2000), 30 arc-sec, country tiles of the geodata service
# (masked to the country, NaN outside). Each canonical cell takes the pixel containing its centre;
# units get area-weighted means. Normals are dated by the first year of the window (02 §5 multi-year
# rule): monthly normals 1970-01 … 1970-12 (freq M), bioclimatic variables 1970 (freq P).
source: worldclim
driver: raster
version: 1.0.0
description: WorldClim 2.1 monthly mean temperature and precipitation normals and BIO1-BIO19 on the canonical grid; zonal means per admin unit (ADM1-ADM4).
dataset: worldclim-climate-normals
discover:
  files:
    - { key: tavg, url: https://geodata.ucdavis.edu/climate/worldclim/2_1/tiles/iso/LKA_wc2.1_30s_tavg.tif }
    - { key: prec, url: https://geodata.ucdavis.edu/climate/worldclim/2_1/tiles/iso/LKA_wc2.1_30s_prec.tif }
    - { key: bio, url: https://geodata.ucdavis.edu/climate/worldclim/2_1/tiles/iso/LKA_wc2.1_30s_bio.tif }
