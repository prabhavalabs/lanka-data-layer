# Central Environmental Authority: National Environmental (Noise Control) Regulations No. 1 of
# 1996 (Gazette 924/12, 21 May 1996), text-layer PDF on cea.lk. Schedule I, the maximum
# permissible noise levels at boundaries (LAeq,T in dB(A)) for low, medium and high noise areas
# and silent zones, day (06:00-18:00) and night (18:00-06:00). The period is the regulation's
# date (a snapshot of the rule in force). Silent-zone polygons (100 m from courthouses,
# hospitals, libraries, schools, zoos, sacred and recreation areas) are a derived product of
# this rule and facility points; not generated here.
# Licence permission_unclear (gazette text): published with attribution and the takedown
# contact (08 §2).
source: cea
driver: pdf_table
version: 1.0.0
description: >-
  Noise Control Regulations 1996, Schedule I: permissible noise levels by area type, day and night.
  Class B: reviewed against the evidence sheet.
discover:
  files:
    - key: noise-regulations-1996
      url: https://www.cea.lk/web/images/pdf/noise/reg924-12.pdf
      edition: "1996"
extract:
  tables:
    - { id: schedule_1, file: noise-regulations-1996, template: cea/noise-schedule-1 }
standardise:
  dataset: noise-control-zones
  vintage: "Gazette 924/12 ({edition})"
  outputs:
    - table: schedule_1
      indicator: envi.noise_limit_db
      geo: { fixed: root }
      period: { fixed: "1996-05-21" }
      columns: { day: { time_of_day: day }, night: { time_of_day: night } }
      rows:
        "Low Noise": { zone_type: low_noise }
        "Medium Noise": { zone_type: medium_noise }
        "High Noise": { zone_type: high_noise }
        "Silent Zone": { zone_type: silent }
expect:
  - { check: row_count, min: 8, max: 8 }
  - { check: range, min: 30, max: 90 }
