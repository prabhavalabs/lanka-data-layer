# Age (shared master: single, 5-year and broad bands)
# Source/authority: SDMX global codelist CL_AGE (SDMX Global Registry); band choice covers DCS census A5/GN tables, DCS LFS, ILOSTAT (ILO harmonised bands), UN WPP and WorldPop 5-year groups.
# Note: Bands overlap by design (5-year, broad and survey-specific bands live in one list, as in CL_AGE); no code has a parent because overlapping bands do not form one additive hierarchy - an indicator must use one non-overlapping partition per release.
# Note: Census 2024 A5 tables keep using the existing `age_group` codelist (0-14, 15-59, 60-64, 65+); every one of those bands also exists here.
# Status: complete for the classification as cited.
# Labels: English only; si/ta pending native-speaker review (not machine-translated).
# Order: codes are listed in display order.
# Used by: dcs-census-2024-gnd, ilostat-lka
