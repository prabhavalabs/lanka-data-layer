# Merchandise trade category (CBSL)
# Source/authority: Central Bank of Sri Lanka, statistical tables 2.02 (exports) and 2.04 (imports),
#   classification revised in January 2023 (HS-code concordance in the workbooks' first sheet).
# Note: exports (x_) and imports (m_) are separate trees under one root; `total` is the total of
#   the indicator's own flow (total exports for trade.exports_usd, total imports for trade.imports_usd).
#   m_non_oil (non-oil imports) is a memo item outside the tree.
# Status: complete for the classification as cited (every row of the USD sheets).
# Labels: English only; si/ta pending native-speaker review (not machine-translated).
# Order: codes are listed in display order.
# Used by: cbsl-merchandise-trade
id: trade_category
title: Merchandise trade category (CBSL)
