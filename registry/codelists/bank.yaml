# Licensed bank (CBSL branch statistics)
# Source/authority: Central Bank of Sri Lanka, Economic and Social Statistics of Sri Lanka, tables 7.8 and 7.9
#   (banks licensed under the Banking Act No. 30 of 1988).
# Note: the parent is the licence group (licensed commercial / licensed specialised bank); foreign banks are one
#   group as published. Lankaputhra Development Bank merged into Pradeshiya Sanwardhana Bank on 1 April 2019;
#   DFCC Bank and DFCC Vardhana Bank amalgamated on 1 October 2015.
# Status: complete for the banks named in the 2026 edition.
# Labels: English only; si/ta pending native-speaker review (not machine-translated).
# Order: codes are listed in display order.
# Used by: cbsl-bank-branches
