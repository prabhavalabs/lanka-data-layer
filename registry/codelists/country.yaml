# Country or area (ISO 3166-1 alpha-2)
# Source/authority: ISO 3166-1 alpha-2 (ISO 3166 Maintenance Agency); code list taken from the IANA tz iso3166.tab copy of ISO 3166-1, names normalised to ISO short names.
# Note: Shared by every country-valued dimension (origin_country, source_country, destination country, trade partner): reference it as {id: <dim>, codelist: country}.
# Note: Codes are alpha-2 as in SDMX CL_AREA; alpha-3 / M49 crosswalk is a registry/crosswalks job.
# Note: Source-specific regional aggregates (e.g. SLTDA 'Western Europe', SLBFE 'Middle East') are not countries: add them as codes here only once a dataset needs them, with parent total.
# Status: complete for the classification as cited.
# Labels: English only; si/ta pending native-speaker review (not machine-translated).
# Order: codes are listed in display order.
# Used by: boi-fdi-inflows, slbfe-labour-migration, sltda-tourist-arrivals, wits-trade-partners
