# Economic activity (ISIC Rev.4 / SLSIC Rev.4 sections, with DCS broad sectors)
# Source/authority: UN ISIC Rev.4 (UNSD, 2008) sections A-U; DCS Sri Lanka Standard Industrial Classification (SLSIC) Rev.4 is identical at section level.
# Source/authority: DCS national accounts broad sectors: Agriculture = A, Industries = B-F, Services = G-T (DCS GDP releases).
# Note: Broad sectors agriculture/industry/services are aggregates with the sections as children, so provincial GDP, LFS 'sector' and PMI (C / services) reuse this list.
# Note: DCS GDP by industry publishes ~20+ activity lines (e.g. growing of tea, rice) finer than sections; those need ISIC division codes added here as children of the sections.
# Status: complete for the classification as cited.
# Labels: English only; si/ta pending native-speaker review (not machine-translated).
# Order: codes are listed in display order.
# Used by: cbsl-pmi, dcs-economic-census-establishments, dcs-gdp-by-industry, dcs-lfs-annual-subnational, dcs-lfs-quarterly, dcs-pocketbook-prices-wages, dcs-ppi, dcs-provincial-gdp
