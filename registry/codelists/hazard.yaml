# Natural hazard type (EM-DAT families, GLIDE codes)
# Source/authority: CRED EM-DAT classification of natural hazards (geophysical, hydrological, meteorological, climatological, biological); GLIDE hazard codes (glidenumber.net).
# Source/authority: Covers ThinkHazard! (11 hazards), DesInventar Sri Lanka and DMC situation-report event types.
# Note: ThinkHazard 'water scarcity' maps to drought; 'river flood', 'urban flood', 'coastal flood' map to the flood children.
# Note: EM-DAT places landslide (wet mass movement) under hydrological; dry mass movement would be geophysical.
# Status: complete for the classification as cited.
# Labels: English only; si/ta pending native-speaker review (not machine-translated).
# Order: codes are listed in display order.
# Used by: dcs-pocketbook-social-services, derived-multi-hazard-exposure, desinventar-losses, dmc-situation-report-impacts, emdat-lka, gdacs-alerts, idmc-displacements, thinkhazard-levels
