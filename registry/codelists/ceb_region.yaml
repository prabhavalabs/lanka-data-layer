# CEB distribution region ("Distribution Provinces as per CEB Classification")
# Source/authority: Ceylon Electricity Board, Statistical Digest 2025 (sales, consumer accounts and revenue by
#   distribution province), grouped into CEB Distribution Divisions 1-4 as printed.
# Note: CEB regions are not admin provinces (North Western and Central are split in two, Colombo City and the Western
#   regions cut across districts); no p-code crosswalk is implied.
# Status: complete for the classification as cited (2024-2025).
# Labels: English only; si/ta pending native-speaker review (not machine-translated).
# Order: codes are listed in display order.
# Used by: ceb-statistical-digest
