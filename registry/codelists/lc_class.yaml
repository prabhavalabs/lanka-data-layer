  - { code: "10", label: Tree cover, parent: total }
  - { code: "20", label: Shrubland, parent: total }
  - { code: "30", label: Grassland, parent: total }
  - { code: "40", label: Cropland, parent: total }
  - { code: "50", label: Built-up, parent: total }
  - { code: "60", label: Bare / sparse vegetation, parent: total }
  - { code: "70", label: Snow and ice, parent: total }
  - { code: "80", label: Permanent water bodies, parent: total }
  - { code: "90", label: Herbaceous wetland, parent: total }
  - { code: "95", label: Mangroves, parent: total }
  - { code: "100", label: Moss and lichen, parent: total }
