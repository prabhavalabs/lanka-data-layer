# Note: Group codes g100-g900 are local roll-ups of the DAC sector groups; sector codes are the official 3-digit DAC codes.
# Note: ERD foreign-financing sectors are ERD-specific; map them to DAC 3-digit codes in a crosswalk before ingest.
# Status: complete for the classification as cited.
# Labels: English only; si/ta pending native-speaker review (not machine-translated).
# Order: codes are listed in display order.
# Used by: erd-foreign-financing, iati-activities-lka
