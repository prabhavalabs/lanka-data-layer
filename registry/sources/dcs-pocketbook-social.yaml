notes: >-
  The social chapters of the Statistical Pocket Book (the publication page serves the PDF itself):
  2 population and vital statistics, 4 poverty indices, 12 health, 13 education, 15 local government,
  plus Statistical Abstract table 4.6 (district poverty headcount), which feeds the same poverty dataset.
  Same publication as dcs-pocketbook; kept as its own source so the social tables have their own
  pdf_table connector and templates (registry/templates/dcs-pocketbook-social/). Class B: every
  version is reviewed against its evidence sheet.
