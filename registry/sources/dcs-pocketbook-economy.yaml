notes: >-
  The economy tables of the Statistical Pocket Book 2026 (one 104-page PDF served directly at the
  publication URL). A separate source id from dcs-pocketbook (social tables) so each has its own
  pdf_table connector. Text-layer PDF; tables read through registry templates
  (registry/templates/dcs-pocketbook-economy/). Many tables are compiled from other agencies; the
  original agency is named in each dataset's method. Licence unstated: published with attribution
  and the takedown contact; it does not block ingestion.
