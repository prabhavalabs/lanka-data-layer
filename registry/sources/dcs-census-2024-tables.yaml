notes: >-
  The CPH 2024 web pages serve Excel workbooks directly: HousingA/A1-A8 (district, trilingual labels),
  HH_DS_excel / OHU_DS_excel (DS division, BIFF .xls with DCS province, district and DS codes) and
  HH_GND_excel (GN division, with GN codes). The DS and GN workbooks carry DCS codes, which are the
  COD-AB p-code digits (LK + district + 2-digit DS + 3-digit GN), so no name matching is needed below
  district. Same publisher and licence as dcs-census-2024 (whose code connector reads the population
  tables A5-A7); kept as a separate source so the declarative xlsx_table driver can read these tables.
  Request written reuse permission (decision D4).
