# Statistical Abstract, chapter 7, table 7.14: total cargo handled by port
# ('000 t), seven years. Each port is a banner line followed by its cargo rows
# (Colombo has five, Trincomalee/Galle/Hambantota/Kankesanthurai three), so rows
# are told apart by occurrence.
id: dcs-statistical-abstract/table-7.14-cargo-by-port
title: Total cargo handled by port ('000 t)
editions:
  - match: { edition: "2024..2026" }
    locate:
      page: { find_text: "Table 7.14", then_text: "Total cargo handled by Port" }
    label: { key: item, header: "Port and Item" }
    columns:
      - { key: y1, header: "2018" }
      - { key: y2, header: "2019" }
      - { key: y3, header: "2020" }
      - { key: y4, header: "2021" }
      - { key: y5, header: "2022" }
      - { key: y6, header: "2023" }
      - { key: y7, header: "2024" }
    rows: { stop_at: ["Source"] }
    number: { thousands: "," }
    checks:
      # 2018 Colombo: the components sum to 99,151 but the total prints 100,151
      # (table 7.13 also gives 100,152): an upstream typo in a component, so 2018 is
      # left out of this check and the printed values are kept.
      - { sum_rows: ["Dry and Liquid cargo discharged#1", "Dry cargo loaded#1", "Liquid cargo discharged#1", "Liquid cargo loaded#1"], equals_row: "Total cargo handled#1", columns: [y2, y3, y4, y5, y6, y7], tol: 2 }
      - { sum_rows: ["Dry and Liquid cargo discharged#2", "Dry cargo loaded#2"], equals_row: "Total cargo handled#2", tol: 2 }
      - { row_count: { min: 17, max: 17 } }
