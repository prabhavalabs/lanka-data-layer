# Units of measure (UCUM case-sensitive codes; ISO 4217 for money).
# Validated by schema/units.schema.json, synced to catalog.units_of_measure.
# `{annotation}` codes are UCUM unity annotations for countables.
units:
  - { code: '%', label: 'percent', kind: ratio }
  - { code: '/10*3', label: 'per 1,000', kind: ratio }
  - { code: '/10*4', label: 'per 10,000', kind: ratio }
  - { code: '/10*5', label: 'per 100,000', kind: ratio }
  - { code: '/10*5{live_birth}', label: 'per 100,000 live births', kind: ratio }
  - { code: '/km2', label: 'per km²', kind: ratio }
  - { code: '/{person}', label: 'per person', kind: ratio }
  - { code: '1', label: 'ratio (unitless)', kind: ratio }
  - { code: 'Cel', label: 'degrees Celsius', kind: physical }
  - { code: 'GW.h', label: 'gigawatt-hours', kind: physical }
  - { code: 'LKR', label: 'Sri Lanka rupees', kind: currency }
  - { code: 'LKR/har', label: 'rupees per hectare', kind: currency }
  - { code: 'LKR/kg', label: 'rupees per kilogram', kind: currency }
  - { code: 'LKR/{unit}', label: 'rupees per unit', kind: currency }
  - { code: 'MW', label: 'megawatts', kind: physical }
  - { code: 'MW.h', label: 'megawatt-hours', kind: physical }
  - { code: 'Mbit/s', label: 'megabits per second', kind: physical }
