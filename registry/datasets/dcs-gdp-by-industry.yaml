id: dcs-gdp-by-industry
title: GDP by industry (current and constant prices)
description: Annual and quarterly gross value added by ISIC activity, current and constant (2015) prices, and growth rates.
source_ids:
- dcs-national-accounts
- dcs-pocketbook-economy
indicators:
- id: econ.gdp_current
  label: GDP at current market prices
  unit: LKR
  unit_mult: 6
  measure_type: sum
  aggregation: sum
  class: official
  geo_levels:
  - national
  period_type: quarter
- id: econ.gva_by_industry
  label: Gross value added by industry
  unit: LKR
  unit_mult: 6
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - industry
  - price_basis
  geo_levels:
  - national
  period_type: quarter
- id: econ.gdp_growth_real
  label: Real GDP growth
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  geo_levels:
  - national
  period_type: quarter
- id: econ.gdp_by_activity_annual
  label: GDP and gross value added by major economic activity (annual)
  unit: LKR
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: activity
    codelist: gdp_activity
  - price_basis
  geo_levels:
  - national
  period_type: year
  unit_mult: 6
  definition: Rs. million; current market prices or constant (2015) prices.
time_coverage:
  from: '2020'
  to: '2025'
method: Statistical Pocket Book 2026 tables 10.2 (current prices) and 10.3 (constant 2015 prices), GVA by the 10 summary activity
  groups, taxes and subsidies on products and GDP, 2020-2025 (2023-2024 revised, 2025 provisional). Quarterly indicators await
  the DCS quarterly release.
limits:
- Annual only from the Pocket Book; 2025 provisional, 2023-2024 revised.
- '''Manufacturing activities'' is a sub-item of group 2, not an additional group.'
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
  - 'derive: sector shares; per-capita GDP with dcs-midyear-population-district'
publication_class: B
