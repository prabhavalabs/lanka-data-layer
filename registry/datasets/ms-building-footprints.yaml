id: ms-building-footprints
title: Building footprints (Microsoft)
description: ML-detected building polygons (2014-2023 imagery).
source_ids:
- ms-buildings
indicators:
- id: built.ms_count
  label: Buildings (Microsoft)
  unit: count
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
time_coverage:
  from: '2023'
method: Quadkey GeoJSONL filtered to LKA.
limits:
- Older imagery; partial overlap with Google.
enrichment:
  joins:
  - 'polygon overlay with ADM4 units: area share per unit; values allocated area- or population-weighted'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
publication_class: A
