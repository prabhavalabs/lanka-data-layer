id: slbfe-labour-migration
title: Foreign employment departures
description: Departures for foreign employment by destination country, skill level, sex and district of origin.
source_ids:
- slbfe
- dcs-pocketbook-economy
indicators:
- id: migr.departures
  label: Departures for foreign employment
  unit: '{person}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - sex
  - id: skill
    codelist: migrant_skill_level
  - id: destination
    codelist: country
  geo_levels:
  - national
  - adm2
  period_type: year
- id: migr.departures_per_1000
  label: Departures per 1,000 working-age population
  unit: /10*3
  measure_type: rate
  aggregation: none
  class: official
  geo_levels:
  - adm2
  period_type: year
- id: migr.departures_by_skill
  label: Departures for foreign employment by manpower level
  unit: '{person}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - sex
  - id: skill
    codelist: migrant_skill_level
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '2017'
  to: '2025'
method: 'Statistical Pocket Book 2026 table 3.10 (SLBFE): 2017-2021 by six manpower levels and sex plus domestic housekeeping
  assistants; 2022-2025 skilled / low-skilled by sex. Destination and district breakdowns await the SLBFE annual report.'
limits:
- The manpower classification changed in 2022 (skilled / low-skilled); series are not comparable across the break.
- Domestic housekeeping assistants (2017-2021) are printed without a sex split.
- 2022 and 2024 are revised (#).
enrichment:
  joins:
  - 'name->p-code crosswalk at district (ADM2) level: registry/crosswalks/ (ds-name-aliases.csv and siblings) (English/Sinhala/Tamil
    spellings, renamed units)'
  aggregations:
  - roll-up ADM2->ADM1->ADM0 by p-code (sum counts; recompute ratios)
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
  - 'cross-source: remittances (cbsl-workers-remittances) vs departures'
publication_class: B
