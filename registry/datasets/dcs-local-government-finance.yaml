id: dcs-local-government-finance
title: Local authority revenue and expenditure
description: Revenue (rates, grants, licences) and expenditure (recurrent/capital) for municipal councils, urban councils
  and pradeshiya sabhas.
source_ids:
- dcs-statistical-abstract
indicators:
- id: lgov.revenue
  label: Local authority revenue
  unit: LKR
  unit_mult: 3
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: revenue_type
    codelist: lg_revenue_type
  - council_type
  geo_levels:
  - national
  - polygon
  period_type: year
- id: lgov.expenditure
  label: Local authority expenditure
  unit: LKR
  unit_mult: 3
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: expenditure_type
    codelist: lg_expenditure_type
  - council_type
  geo_levels:
  - national
  - polygon
  period_type: year
- id: lgov.revenue_per_capita
  label: LA revenue per resident
  unit: LKR
  measure_type: sum
  aggregation: sum
  class: official
  geo_levels:
  - polygon
  period_type: year
time_coverage:
  from: '2015'
  to: '2024'
method: >-
  Statistical Abstract chapter 15 tables 15.4 (revenue) and 15.6 (expenditure) of municipal and urban
  councils, national by council type, read from the PDF through registry templates. Tables 15.5 and 15.7
  (pradeshiya sabhas by province) print rotated column headers and are not read yet.
limits:
- LA boundaries not in COD-AB; requires LA polygon layer (from elections LG 2025 geography).
enrichment:
  joins:
  - LA names -> LA polygons (local-authority boundary layer from elections-commission) -> spatial overlay to ADM3
  aggregations:
  - LA -> district -> province (sum)
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
publication_class: B
