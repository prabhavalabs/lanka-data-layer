id: irrigation-river-water-levels
title: River gauging stations and flood thresholds
description: The Irrigation Department's 40 river gauging stations (Hydrology and Disaster Management Division) as point
  features, with river and the alert, minor-flood and major-flood water levels of each gauge.
source_ids:
- nuuuwan-lk-irrigation
- irrigation-dept
indicators:
- id: water.river_gauges
  label: River gauging stations
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  geo_levels:
  - point
  - adm1
  - adm2
  period_type: snapshot
time_coverage:
  from: '2026'
method: 'Station register data/static/stations.json of nuuuwan/lk_irrigation (git_files, pinned to a commit), parsed by
  nuuuwan from the Irrigation Department river-water-level dashboard (ArcGIS layer gauges_2_view). Coordinates as published
  (WGS84), thresholds in metres. The admin unit of each gauge comes from point-in-polygon at staging, not from the
  repository''s district_id list (kept as an attribute: several gauges list the districts they warn).'
limits:
- Gauges cover major rivers only.
- Thresholds of 0 mean "not set" upstream (Ampara).
- Readings (several a day, about 7 days kept by the official layer) are not in this dataset yet; nuuuwan/lk_irrigation keeps
  the history since 2022.
enrichment:
  joins:
  - 'point-in-polygon: each feature gets its ADM4 p-code (and ADM3/ADM2/ADM1 by hierarchy) via the grid lookup'
  - station -> HydroBASINS basin -> downstream ADM4 units
  aggregations:
  - 'derive: population downstream of gauges at alert'
kind: features
publication_class: A
searchable: true
fields:
- {name: river, type: string, label: River}
- {name: districts_warned, type: string, label: "Districts listed for the gauge (ISO 3166-2, upstream)"}
- {name: alert_level_m, type: number, label: Alert level (m)}
- {name: minor_flood_level_m, type: number, label: Minor flood level (m)}
- {name: major_flood_level_m, type: number, label: Major flood level (m)}
