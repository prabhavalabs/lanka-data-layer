id: nasadem
title: NASADEM elevation (SRTM reprocessed)
description: 30 m void-filled SRTM-based DEM (alternative/check to Copernicus DEM).
source_ids:
- nasa-earthdata
indicators:
- id: terrain.nasadem_elevation
  label: Elevation (NASADEM)
  unit: m
  measure_type: mean
  aggregation: none
  class: third_party
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  period_type: snapshot
  time_invariant: true
time_coverage:
  from: '2000'
method: HGT tiles.
limits:
- Year-2000 surface.
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - QA vs copernicus-dem-terrain
publication_class: A
