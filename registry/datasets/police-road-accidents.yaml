id: police-road-accidents
title: Road traffic accidents by police division
description: Fatal, grievous and minor road accidents and fatalities by police division and road user type.
source_ids:
- police-lk
- dcs-statistical-abstract
indicators:
- id: tran.road_accidents_reported
  label: Road accidents reported to the police
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  geo_levels:
  - national
  period_type: year
- id: tran.road_accident_deaths
  label: Deaths due to road accidents
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  geo_levels:
  - national
  period_type: year
- id: tran.road_accident_injured
  label: Persons injured in road accidents
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  geo_levels:
  - national
  period_type: year
- id: tran.accidents_fatal
  label: Fatal road accidents
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - road_user
  geo_levels:
  - national
  - polygon
  - adm2
  period_type: year
- id: tran.fatalities_per_100k
  label: Road fatalities per 100,000
  unit: '/10*5'
  measure_type: rate
  aggregation: none
  class: official
  geo_levels:
  - national
  - adm2
  period_type: year
time_coverage:
  from: '2015'
  to: '2025'
method: PDF tables. Loaded so far - Statistical Abstract table 7.4 (accidents reported to the police, deaths and injured, national, five years; figures from the Department of Police). Police-division tables are crosswalked to districts when added.
limits:
- Police divisions do not nest in districts.
- 'Abstract 2025 prints 4,535 deaths for 2023 in table 7.4 but 2,321 persons killed in table 7.6 (2,363-2,515 in the other years); 4,535 is loaded as printed. Table 7.6 (killed by road user) is not loaded: its PDF rows are misaligned (values for drivers, cyclists and motorcycle riders sit on the wrong lines).'
enrichment:
  joins:
  - police division -> district crosswalk
  aggregations:
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
  - 'cross-source: crash rate vs road length and vehicle fleet'
publication_class: B
