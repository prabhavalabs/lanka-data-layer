id: dcs-pocketbook-agriculture
title: 'Agriculture compendium: crops, livestock, fisheries, food balance'
description: Extent and production of major crops, cost of production, livestock and fish production, paddy irrigation sources,
  per-capita food and nutrient availability.
source_ids:
- dcs-pocketbook-economy
indicators:
- id: agri.crop_extent
  label: Extent under crop
  unit: har
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - crop
  geo_levels:
  - national
  period_type: year
- id: agri.crop_production
  label: Crop production
  unit: t
  measure_type: sum
