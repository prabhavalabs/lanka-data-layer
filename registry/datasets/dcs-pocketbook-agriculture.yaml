time_coverage:
  from: '2015'
  to: '2025'
method: 'Statistical Pocket Book 2026 tables 6.2 (paddy irrigation), 6.3 (crop extent), 6.4 (crop production), 6.5 (cost of
  production), 6.7 (food balance: calories, protein, fat), 6.8 (livestock, milk, eggs), 6.10 (fish production) and 6.11 (fishing
  fleet, fishers). PDF tables read through registry templates; reviewed.'
limits:
- Pocket Book rounding; 2025 values provisional or estimated where flagged.
- Cost of production is by financial year; the period is the first calendar year (2015/16 -> 2015).
- Irrigated extent counts both seasons, so it can exceed the irrigable extent.
- '6.11 2023 active fishers: marine + inland = 318,474 but the total prints 318,754.'
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: B
