time_coverage:
  from: '2016'
  to: '2025'
method: 'Statistical Abstract 2025 tables 4.1a (labour force 2016-2024, persons) and 4.2a (employment by the 17 LFS industry
  groups 2018-2024, persons); LFS quarterly report 2026 Q2 annex table 1 (labour force status by sex: male and female 2017-2025,
  both sexes 2025); Statistical Pocket Book 2026 table 3.2 for 2025 industry groups (thousands, scaled to persons), 3.3 (occupation
  2021-2025, thousands), 3.6 (informal share by district, 2025) and 3.7 (unemployment rate by province and sex 2022-2025).
  PDF tables read through registry templates; reviewed.'
limits:
- District and province estimates have large sampling error; DCS flags the province figures (high CV).
- 2024 and 2025 are provisional. Pocket Book figures are rounded to thousands; Abstract figures are persons.
- Industry groups 4 (D, E, F) and 17 (L, R, U) are LFS groupings (codes DEF, LRU), not single ISIC sections.
- Occupation 0 is printed as 'Armed forces occupations and unidentified occupations'.
- Informal share is of non-agricultural employment (2025, provisional).
enrichment:
  joins:
  - 'name->p-code crosswalk at district (ADM2) level: registry/crosswalks/ (ds-name-aliases.csv and siblings) (English/Sinhala/Tamil
    spellings, renamed units)'
  - province names -> ADM1 p-codes (9 fixed provinces; trivial crosswalk)
  aggregations:
  - no additive roll-up for rates; counts roll up district->province
publication_class: B
