id: openaq-air-quality
title: Air quality measurements (PM2.5, NO2)
description: Hourly air pollutant concentrations at monitoring stations.
source_ids:
- openaq
indicators:
- id: env.pm25
  label: PM2.5 concentration
  unit: ug/m3
  dims:
  - station
  geo_levels:
  - point
  period_type: day
time_coverage:
  from: 2016-01
  to: 2026-11
method: API v3 pull, daily means.
limits:
- Sparse network; low-cost sensor calibration varies.
enrichment:
  joins:
  - 'point-in-polygon: each feature gets its ADM4 p-code (and ADM3/ADM2/ADM1 by hierarchy) via the grid lookup'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: A
