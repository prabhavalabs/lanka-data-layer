id: ilostat-lka
title: ILO labour statistics
description: Harmonised labour indicators (unemployment, wages, informality, working poverty).
source_ids:
- ilostat
indicators:
- id: ilo.value
  label: ILOSTAT indicator
  unit: various
  dims:
  - indicator
  - sex
  - age
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '1990'
  to: '2025'
method: Rplumber API.
limits:
- Harmonised; may differ from DCS national definitions.
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: A
