id: osm-places
title: Populated places (OSM)
description: Cities, towns, villages, hamlets with names (si/ta/en).
source_ids:
- osm-geofabrik
indicators:
- id: places.osm_places
  label: Named places
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: third_party
  dims:
  - place_class
  geo_levels:
  - point
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
time_coverage:
  from: '2026'
method: place=* nodes.
limits:
- 'Completeness varies: dense in Colombo/Kandy/Galle, thinner in the North, East and estate areas; volunteered data.'
enrichment:
  joins:
  - 'point-in-polygon: each feature gets its ADM4 p-code (and ADM3/ADM2/ADM1 by hierarchy) via the grid lookup'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
publication_class: A
