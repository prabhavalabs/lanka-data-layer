id: slpa-port-statistics
title: Port traffic, containers and cargo by port
description: Ship arrivals, TEU throughput (incl. transshipment) and cargo by port (Colombo, Hambantota, Galle, Trincomalee,
  KKS).
source_ids:
- slpa
indicators:
- id: port.teu
  label: Container throughput
  unit: '{TEU}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - port
  - movement_type
  geo_levels:
  - point
  period_type: month
- id: port.ship_arrivals
  label: Ship arrivals
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - port
  geo_levels:
  - point
  period_type: month
time_coverage:
  from: 2015-01
  to: 2026-09
method: Monthly performance tables.
limits:
- Private terminal figures sometimes lag.
enrichment:
  joins:
  - 'point-in-polygon: each feature gets its ADM4 p-code (and ADM3/ADM2/ADM1 by hierarchy) via the grid lookup'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
  - 'cross-source: AIS calls from imf-portwatch-lka'
kind: features
publication_class: B
