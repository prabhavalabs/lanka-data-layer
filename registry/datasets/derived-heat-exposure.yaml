id: derived-heat-exposure
title: Heat exposure
description: Population-weighted hot days (Tmax >= 35 C and heat index thresholds) per unit, with elderly and outdoor-worker
  exposure.
source_ids:
- lanka-data-layer-derived
indicators:
- id: exp.heat_person_days
  label: Person-days of extreme heat
  unit: person-days
  geo_levels:
  - adm1
  - adm2
  - adm3
  period_type: year
- id: exp.heat_elderly_days
  label: Elderly (60+) person-days of extreme heat
  unit: person-days
  geo_levels:
  - adm1
  - adm2
  - adm3
  period_type: year
time_coverage:
  from: '1990'
  to: '2026'
method: ERA5-Land daily Tmax x population.
limits:
- Reanalysis temperature, not station.
enrichment:
  derived_from:
  - era5-land-climate
  - worldpop-age-sex
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
publication_class: A
