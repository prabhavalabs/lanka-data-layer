id: ntc-bus-statistics
title: Private bus fleet, seating capacity and operations (NTC)
description: Private bus fleet, buses operated, seating capacity, operated km and passenger km by province (intra-provincial)
  and for NTC inter-provincial permits, and the inter-provincial fleet by service class over nine years.
source_ids:
- ntc
indicators:
- id: tran.bus_fleet
  label: Bus fleet
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - operator
  - route_type
  - bus_service_class
  geo_levels:
  - national
  - adm1
  period_type: year
- id: tran.buses_operated
  label: Buses operated
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - operator
  - route_type
  - bus_service_class
  geo_levels:
  - national
  - adm1
  period_type: year
- id: tran.bus_seating_capacity
  label: Seating capacity of buses operated
  unit: '{seat}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - operator
  - route_type
  geo_levels:
  - national
  - adm1
  period_type: year
- id: tran.bus_km_operated
  label: Bus kilometres operated
  unit: km
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - operator
  - route_type
  geo_levels:
  - national
  - adm1
  period_type: year
- id: tran.bus_passenger_km
  label: Bus passenger kilometres
  unit: km
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - operator
  - route_type
  geo_levels:
  - national
  - adm1
  period_type: year
time_coverage:
  from: '2015'
  to: '2023'
method: 'PDF tables of the NTC National Transport Statistics (2024 edition, data year 2023) read through registry templates:
  table 6.2 (private bus operational data by province, intra- and inter-provincial) and table 6.1 (inter-provincial fleet by
  service class, 2015-2023). Province names resolve to ADM1 p-codes; intra-provincial total, NTC (inter-provincial) and
  grand total rows are national.'
limits:
- Permits are not observed service; seating capacity is of buses operated.
- 'Upstream inconsistency (table 6.2, 2023): the provinces'' operated km add up to 539,189,680 while the printed
  intra-provincial total is 316,660,224; both are published as printed.'
- 2023 inter-provincial figures repeat 2022 for most service classes (as printed).
enrichment:
  joins:
  - province names -> ADM1 p-codes (9 fixed provinces; trivial crosswalk)
  aggregations:
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
  - buses and seats per 10k population
publication_class: B
