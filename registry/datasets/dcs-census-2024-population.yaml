id: dcs-census-2024-population
title: 'Census 2024: population by age, sex, DS division'
description: Enumerated population by sex and age group at DS level (GN via lk_census_2024), with 2012->2024 change.
source_ids:
- dcs-census-2024
- nuuuwan-lk-census-2024
indicators:
- id: census24.pop_total
  label: Enumerated population
  unit: '{person}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - sex
  geo_levels:
  - national
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
- id: census24.pop_age_sex
  label: Population by age group and sex
  unit: '{person}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - sex
  - age_group
  geo_levels:
  - national
  - adm1
  - adm2
  - adm3
  period_type: snapshot
- id: census24.pop_change_2012
  label: Population change 2012-2024
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  geo_levels:
  - national
  - adm1
  - adm2
  - adm3
  period_type: snapshot
- id: census24.sex_ratio
  label: Males per 100 females
  unit: '1'
  measure_type: ratio
  aggregation: none
  class: official
  geo_levels:
  - national
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
time_coverage:
  from: '2024'
method: Parse DS tables from HTML/XLS; GN tables via lk_census_2024; DS names crosswalked to p-codes; 2012 values re-based
  via admin-region-history.
limits:
- Census reference night 2024; no intercensal updates.
- DS boundary changes since 2012 make change figures approximate for split DSs.
enrichment:
  joins:
  - 'name->p-code crosswalk at DS (ADM3) level: registry/crosswalks/ (ds-name-aliases.csv and siblings); DS renames/splits
    since 2012 handled by effective-dated rows'
  - gnd-id-crosswalk for GN rows
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - density per km2 using ADM area from cod-ab-lka-boundaries
  - 'derive: dependency ratios, ageing index, change maps'
publication_class: B
