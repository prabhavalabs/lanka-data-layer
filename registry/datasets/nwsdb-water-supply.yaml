id: nwsdb-water-supply
title: Water supply coverage and utility performance (NWSDB)
description: National pipe-borne water supply coverage (NWSDB and community schemes), access to safe drinking water,
  non-revenue water, staff per 1,000 connections and collection efficiency from the NWSDB annual report.
source_ids:
- nwsdb
indicators:
- id: water.pipe_borne_coverage
  label: Population served by pipe-borne water supply
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  dims:
  - id: supplier
    codelist: water_supplier
  geo_levels:
  - national
  period_type: year
- id: water.safe_water_access
  label: Population with access to safe drinking water
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  geo_levels:
  - national
  period_type: year
- id: water.non_revenue_water
  label: Non-revenue water
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  geo_levels:
  - national
  period_type: year
- id: water.staff_per_1000_connections
  label: NWSDB staff per 1,000 connections
  unit: '/10*3'
  measure_type: ratio
  aggregation: none
  class: official
  geo_levels:
  - national
  period_type: year
- id: water.collection_efficiency
  label: Billing collection efficiency
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '2023'
  to: '2024'
method: 'Text-layer PDF of the NWSDB Annual Report 2024 (Google Drive link from waterboard.lk) read through the registry
  template nwsdb/service-level-improvements (table 05: report year and previous year). Class B.'
limits:
- National figures only in the text layer; the report's connection counts, production and regional tables (14, 15, 32)
  are printed as images and need OCR (class C), not done yet.
- The staff ratio is printed with a % unit in the report; it is staff per 1,000 connections.
enrichment:
  joins:
  - 'national series: no spatial join'
  aggregations:
  - 'time series derivations: year-on-year change'
publication_class: B
