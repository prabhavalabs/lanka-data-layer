id: worldpop-pop-grid
title: Gridded population (WorldPop, 100 m, 2015-2030)
description: Modelled population counts per 100 m cell, constrained to built settlement, census-adjusted; annual 2015-2030.
source_ids:
- worldpop
indicators:
- id: pop.grid_total
  label: Population (modelled)
  unit: '{person}'
  measure_type: count
  aggregation: sum
  class: third_party
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
- id: pop.grid_density
  label: Population density (modelled)
  unit: /km2
  measure_type: rate
  aggregation: none
  class: third_party
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
time_coverage:
  from: '2015'
  to: '2030'
method: Download annual constrained 100 m (3 arc-second) GeoTIFFs, resample to the canonical grid by area-weighted redistribution (area_sum), zonal sums per ADM1-ADM4 unit; density = zonal sum per km2 of the unit's land cells (cells whose centre lies inside the unit).
limits:
- Modelled, not counted; small-area (single cell) values are unreliable.
- Constrained to mapped settlement (cells without built settlement hold 0); rural densities are lower than census density over the whole unit area.
- 'pop.grid_density divides by land-cell area, not by the geodesic unit area of derived.per_km2; the two differ slightly on coasts.'
- Projected years beyond the latest census are extrapolations.
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - density per km2 using ADM area from cod-ab-lka-boundaries
  - denominator for every population-weighted derived product
publication_class: A
