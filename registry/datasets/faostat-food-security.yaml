id: faostat-food-security
title: Food security indicators (FAOSTAT)
description: Prevalence of undernourishment, food insecurity (FIES), dietary energy supply.
source_ids:
- faostat
indicators:
- id: fao.food_security
  label: Food security indicator
  unit: '{various}'
  measure_type: score
  aggregation: none
  class: third_party
  dims:
  - id: indicator
    codelist: fao_fs_indicator
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '2000'
  to: '2024'
method: FS domain.
limits:
- 3-year averages are stored at the last year of the window (2000-2002 → 2002); the item label says "3-year average".
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: A
