id: treasury-province-transfers
title: Transfers to provincial councils
description: Central government transfers to each provincial council, recurrent and capital, from the Ministry of Finance
  annual report (Final Budget Position Report), table "Transfers to Provinces".
source_ids:
- treasury-annual-report
indicators:
- id: fisc.pc_transfers
  label: Transfers to provincial councils
  unit: LKR
  unit_mult: 6
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - expenditure_type
  geo_levels:
  - adm1
  period_type: year
time_coverage:
  from: '2021'
  to: '2025'
method: >-
  Table "Transfers to Provinces in <year>" (5.8 or 5.9) of the Ministry of Finance annual report for that year (PDF text
  layer, reviewed template), Rs. million.
limits:
- Transfers as reported in the annual report (Department of National Budget, Department of State Accounts); the split
  into block, criteria-based and province-specific grants is not printed in this table.
- Projects implemented by the ministry in charge of provincial councils are printed as a separate line with no province
  and are not loaded, so provinces do not sum to the printed total.
enrichment:
  joins:
  - province names -> ADM1 p-codes (9 fixed provinces; trivial crosswalk)
  aggregations:
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
  - 'cross-source: per-capita transfers vs poverty rates'
publication_class: B
