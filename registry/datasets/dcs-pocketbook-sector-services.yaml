id: dcs-pocketbook-sector-services
title: Energy, telecom, transport and tourism summary (Pocket Book)
description: Energy supply/consumption, telecom subscriptions, passenger and freight transport, tourism activity summaries.
source_ids:
- dcs-pocketbook
indicators:
- id: pb.energy_supply
  label: Primary energy supply
  unit: '{ktoe}'
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: source
    codelist: energy_source
  geo_levels:
  - national
  period_type: year
- id: pb.telecom_subscriptions
  label: Telecom subscriptions
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - id: service
    codelist: telecom_service
  geo_levels:
  - national
  period_type: year
- id: pb.passenger_km
  label: Passenger kilometres
  unit: '{passenger}.km'
  unit_mult: 6
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - mode
  geo_levels:
  - national
  period_type: year
- id: pb.tourist_arrivals
  label: Tourist arrivals
  unit: '{person}'
  measure_type: count
  aggregation: sum
  class: official
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '2015'
  to: '2025'
method: PDF tables; superseded by primary sources (slsea, trcsl, ntc, sltda) where ingested.
limits:
- Compendium copies; check primary source vintages.
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: B
