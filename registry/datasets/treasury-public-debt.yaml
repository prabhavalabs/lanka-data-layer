id: treasury-public-debt
title: Public debt stock and creditor composition
description: Central government debt by instrument, currency and creditor (bilateral, multilateral, commercial), domestic
  debt composition.
source_ids:
- treasury-debt
indicators:
- id: debt.total
  label: Central government debt stock
  unit: LKR
  unit_mult: 6
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - instrument
  geo_levels:
  - national
  period_type: quarter
- id: debt.external_by_creditor
  label: External debt by creditor
  unit: USD
  unit_mult: 6
  measure_type: sum
  aggregation: sum
  class: official
  dims:
