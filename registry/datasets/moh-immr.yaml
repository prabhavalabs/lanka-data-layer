id: moh-immr
title: Hospital morbidity and mortality (IMMR)
description: Inpatient live discharges and hospital deaths by IMMR disease group (ICD-10 based), sex and age band from
  government hospitals, national totals.
source_ids:
- moh-health
indicators:
- id: heal.inpatient_discharges
  label: Inpatient live discharges
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - icd_group
  - sex
  - id: age_group
    codelist: immr_age_band
  geo_levels:
  - national
  - adm2
  period_type: year
- id: heal.hospital_deaths
  label: Hospital deaths
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - icd_group
  - sex
  - id: age_group
    codelist: immr_age_band
  geo_levels:
  - national
  - adm2
  period_type: year
time_coverage:
  from: '2023'
  to: '2024'
method: 'XLSX parse of the IMMR report workbook (sheet "IMMR Report"): one row per IMMR disease group, columns live
  discharges and deaths × sex × age band (with printed totals). The 2024 report carries live discharges for 2024 and deaths
  for 2023 (its Summary sheet: "Live Discharges" and "Deaths - 2023"); periods follow those labels.'
limits:
- Government hospitals only; by hospital location not residence.
- National totals only in the published workbook; district (RDHS) breakdowns are in the Annual Health Bulletin PDF.
- Deaths lag discharges by one year in the 2024 edition.
enrichment:
  joins:
  - RDHS/MOH area names -> MOH-area polygons (nuuuwan/lk_moh_regions) -> spatial overlay to ADM3; RDHS ~ district except Kalmunai
    RDHS (part of Ampara)
  - 'name->p-code crosswalk at district (ADM2) level: registry/crosswalks/ (ds-name-aliases.csv and siblings) (English/Sinhala/Tamil
    spellings, renamed units)'
  aggregations:
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
publication_class: A
