id: dcs-census-2024-ethnicity-religion
title: 'Census 2024: ethnicity and religion'
description: Population by ethnic group and religion by district (DS where released).
source_ids:
- dcs-census-2024
- nuuuwan-lk-census-2024
indicators:
- id: census24.pop_by_ethnicity
  label: Population by ethnicity
  unit: persons
  dims:
  - ethnicity
  geo_levels:
  - national
  - adm1
  - adm2
  - adm3
  period_type: snapshot
- id: census24.pop_by_religion
  label: Population by religion
  unit: persons
  dims:
  - religion
  geo_levels:
  - national
  - adm1
  - adm2
  - adm3
  period_type: snapshot
time_coverage:
  from: '2024'
method: Parse final-report tables.
limits:
- Census reference night 2024; no intercensal updates.
- 'Sensitive: publish counts only at DS and above; no GN-level cross-tabs with small cells.'
enrichment:
  joins:
  - 'name->p-code crosswalk at DS (ADM3) level: registry/crosswalks/ (ds-name-aliases.csv and siblings); DS renames/splits
    since 2012 handled by effective-dated rows'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - 'derive: diversity (Herfindahl) index per unit'
publication_class: B
