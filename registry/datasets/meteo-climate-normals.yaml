id: meteo-climate-normals
title: Station climate normals
description: Monthly mean rainfall and temperature normals at principal stations.
source_ids:
- meteo
- dcs-pocketbook
indicators:
- id: wx.normal_rain
  label: Normal monthly rainfall
  unit: mm
  measure_type: mean
  aggregation: none
  class: official
  dims:
  - station
  geo_levels:
  - point
  period_type: month
  time_invariant: true
- id: wx.normal_temp
  label: Normal monthly mean temperature
  unit: Cel
  measure_type: mean
  aggregation: none
  class: official
  dims:
  - station
  geo_levels:
  - point
  period_type: month
  time_invariant: true
time_coverage:
  from: '1991'
  to: '2020'
method: Pocket Book/Met Dept tables.
limits:
- Station points only.
enrichment:
  joins:
  - 'point-in-polygon: each feature gets its ADM4 p-code (and ADM3/ADM2/ADM1 by hierarchy) via the grid lookup'
kind: features
publication_class: B
