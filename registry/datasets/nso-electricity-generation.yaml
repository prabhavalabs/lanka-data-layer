id: nso-electricity-generation
title: Electricity generation by source (daily and 15-minute)
description: Daily energy generated by station group and quarter-hourly average generation by source on the national grid,
  plus the daily night-peak and minimum demand, from the National System Operator generation summary.
source_ids:
- nso-gensum
indicators:
- id: ener.generation_gwh_daily
  label: Daily electricity generation by station group
  unit: GW.h
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: station_group
    codelist: nso_station_group
  geo_levels:
  - national
  period_type: day
  upstream_id: gensum/energy-data energyGWh
- id: ener.generation_mw_15min
  label: Quarter-hourly generation by source
  unit: MW
  measure_type: mean
  aggregation: none
  class: official
  dims:
  - id: source
    codelist: energy_source
  - id: quarter_hour
    codelist: quarter_hour
  geo_levels:
  - national
  period_type: day
  upstream_id: gensum/load-curve
- id: ener.demand_peak_mw
  label: Daily night-peak and minimum demand
  unit: MW
  measure_type: mean
  aggregation: none
  class: official
  dims:
  - id: peak
    codelist: demand_peak
  geo_levels:
  - national
  period_type: day
  upstream_id: gensum/peak-data activePowerMW
time_coverage:
  from: 2026-09-11
  to: 2026-11
method: 'NSO generation-summary JSON API (edlcare.edl.lk/api/gensum), one request per endpoint and day (discover kind
  dates). Energy per station group in GWh as published; the 15-minute load curve is the average MW of each source over the
  quarter hour ending at the stamp (quarter_hour = HH:MM of the stamp), stored as a day observation with a quarter_hour
  dimension because the sub-daily store (data.obs_hf) has no ingest path yet.'
limits:
- Grid-connected generation only; rooftop solar behind the meter invisible (the load curve's solar covers utility-scale
  plants only).
- BESS is net battery output (negative while charging).
- The load-curve endpoint keeps about six months; daily energy goes back to 2023 (backfill by lowering dates.from).
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
  - 'cross-source: hydro generation vs reservoir levels and CHIRPS rainfall'
  - 'renewable share = (hydro + mini hydro + wind + solar + biomass) / total, recomputed from the daily energy'
publication_class: A
