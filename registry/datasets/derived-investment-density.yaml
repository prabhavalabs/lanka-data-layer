id: derived-investment-density
title: Investment density (BOI, aid, public capital) by district/DS
description: BOI enterprises/employment, aid commitments and budget capital projects per km2 and per capita.
source_ids:
- lanka-data-layer-derived
indicators:
- id: econ.investment_per_capita
  label: Investment per capita
  unit: '{currency}'
  measure_type: mean
  aggregation: none
  class: derived
  dims:
  - channel
  geo_levels:
  - adm2
  - adm3
  period_type: year
- id: econ.boi_jobs_per_1000
  label: BOI jobs per 1,000 working-age residents
  unit: '/10*3'
  measure_type: rate
  aggregation: none
  class: derived
  geo_levels:
  - adm2
  - adm3
  period_type: year
time_coverage:
  from: 2010
  to: 2026
method: Point-in-polygon counts and amounts per unit; per-capita with matched-year intercensal denominators; kernel density
  surface for maps only.
limits:
- Project location = site or HQ address; multi-district projects split equally unless allocation published.
enrichment:
  derived_from:
  - boi-enterprises
  - boi-zones
  - boi-fdi-inflows
  - iati-activities-lka
  - wb-projects-lka
  - budget-capital-projects
  - derived-intercensal-population
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
publication_class: A
