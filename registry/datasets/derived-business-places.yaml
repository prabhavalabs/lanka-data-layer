id: derived-business-places
title: Places and office workplaces per admin unit
description: Counts of Overture places by top-level category and of office workplaces by type per province, district,
  DS division and GN division, and office workplaces per 10,000 enumerated population (Census 2024).
source_ids:
- lanka-data-layer-derived
indicators:
- id: derived.places_count
  label: Places by category (Overture)
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: derived
  dims:
  - id: category
    codelist: overture_category
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
- id: derived.workplace_count
  label: Office workplaces by type (Overture)
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: derived
  dims:
  - workplace_type
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
- id: derived.workplace_per_10k
  label: Office workplaces per 10,000 population
  unit: '/10*4'
  measure_type: rate
  aggregation: none
  class: derived
  dims:
  - workplace_type
  geo_levels:
  - adm1
  - adm2
  - adm3
  period_type: snapshot
time_coverage:
  from: '2026'
method: 'Recipe derived-business-places: features_zonal@1 counts (point in unit by the feature''s deepest admin unit,
  summed up the p-code hierarchy) over overture-places and overture-workplaces, and ratio@1 (count / Census 2024
  population × 10,000; DENOM_MISMATCH because the denominator year differs).'
limits:
- Counts are of Overture place listings (confidence >= 0.5), not establishments or jobs.
- The denominator is the 2024 census population.
enrichment:
  derived_from:
  - overture-places
  - overture-workplaces
  - dcs-census-2024-population
  - derived-census-2024-rollups
publication_class: A
