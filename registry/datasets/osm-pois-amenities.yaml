id: osm-pois-amenities
title: Facilities and amenities (OSM)
description: Hospitals, clinics, pharmacies, schools, universities, banks, ATMs, police, post offices, fuel, places of worship,
  markets, government offices.
source_ids:
- osm-geofabrik
indicators:
- id: fac.osm_count
  label: Facilities by type
  unit: count
  dims:
  - amenity_type
  geo_levels:
  - point
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
- id: fac.osm_per_10k
  label: Facilities per 10,000 population
  unit: per 10k
  dims:
  - amenity_type
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
time_coverage:
  from: '2026'
method: amenity/healthcare/shop/office filters to points (polygons -> centroids).
limits:
- 'Completeness varies: dense in Colombo/Kandy/Galle, thinner in the North, East and estate areas; volunteered data.'
- Absence in OSM is not absence on the ground.
enrichment:
  joins:
  - 'point-in-polygon: each feature gets its ADM4 p-code (and ADM3/ADM2/ADM1 by hierarchy) via the grid lookup'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
  - destinations for derived-travel-time-facilities
publication_class: A
