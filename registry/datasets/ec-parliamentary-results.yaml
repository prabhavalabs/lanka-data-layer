id: ec-parliamentary-results
title: Parliamentary election results 1989-2024
description: Party votes, seats and preferential votes by electoral district and polling division.
source_ids:
- nuuuwan-lk-elections
- elections-commission
indicators:
- id: elec.parl_votes
  label: Votes by party
  unit: votes
  dims:
  - election
  - party
  geo_levels:
  - national
  - adm2
  - polygon
  period_type: snapshot
- id: elec.parl_seats
  label: Seats won
  unit: seats
  dims:
  - election
  - party
  geo_levels:
  - national
  - adm2
  period_type: snapshot
- id: elec.parl_turnout
  label: Turnout
  unit: percent
  dims:
  - election
  geo_levels:
  - national
  - adm2
  - polygon
  period_type: snapshot
time_coverage:
  from: '1989'
  to: '2024'
method: Repo TSV + EC.
limits:
- Results by polling division, not GN; turnout uses registered electors.
enrichment:
  joins:
  - 'electoral district / polling division codes (EC-xx, EC-xxx) -> ADM2 via the electoral crosswalk (22 EDs vs 25 districts:
    Jaffna ED = Jaffna+Kilinochchi, Vanni ED = Mannar+Vavuniya+Mullaitivu)'
  aggregations:
  - PD -> ED -> national
publication_class: A
