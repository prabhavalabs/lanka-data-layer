id: ec-presidential-results
title: Presidential election results 1982-2024
description: Votes by candidate, valid/rejected, registered electors and turnout by polling division and electoral district.
source_ids:
- nuuuwan-lk-elections
- elections-commission
indicators:
- id: elec.pres_votes
  label: Votes by candidate
  unit: '{vote}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - election
  - candidate
  - party
  geo_levels:
  - national
  - adm2
  - polygon
  period_type: snapshot
- id: elec.pres_turnout
  label: Turnout
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  dims:
  - election
  geo_levels:
  - national
  - adm2
  - polygon
  period_type: snapshot
- id: elec.pres_vote_share
  label: Vote share
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  dims:
  - election
  - party
  geo_levels:
  - national
  - adm2
  - polygon
  period_type: snapshot
time_coverage:
  from: '1982'
  to: '2024'
method: Repo TSV + EC verification.
limits:
- Results by polling division, not GN; turnout uses registered electors.
- Preference (second count) votes in 2024 reported nationally.
enrichment:
  joins:
  - 'electoral district / polling division codes (EC-xx, EC-xxx) -> ADM2 via the electoral crosswalk (22 EDs vs 25 districts:
    Jaffna ED = Jaffna+Kilinochchi, Vanni ED = Mannar+Vavuniya+Mullaitivu)'
  aggregations:
  - PD -> ED -> national
  - 'cross-source: vote shares vs census demographics (derived-electoral-demographics)'
publication_class: A
