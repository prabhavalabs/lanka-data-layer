id: soilgrids-properties
title: Soil properties 250 m
description: Soil organic carbon, pH, clay/sand, bulk density at standard depths.
source_ids:
- soilgrids
indicators:
- id: soil.soc
  label: Soil organic carbon (0-30 cm)
  unit: g/kg
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  period_type: snapshot
- id: soil.ph
  label: Soil pH (0-5 cm)
  unit: pH
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  period_type: snapshot
time_coverage:
  from: '2020'
method: WebDAV VRT subset.
limits:
- Model predictions; sparse Sri Lankan soil profiles.
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - area-weighted means and area shares per unit (cells weighted by cell area)
publication_class: A
