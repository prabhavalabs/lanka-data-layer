id: aboveground-biomass
title: Aboveground biomass carbon
description: Aboveground live biomass/carbon density estimates.
source_ids:
- ctrees
indicators:
- id: env.agb_density
  label: Aboveground biomass density
  unit: Mg/har
  measure_type: rate
  aggregation: none
  class: third_party
  geo_levels:
  - raster
  - adm1
  - adm2
  period_type: year
time_coverage:
  from: '2020'
  to: '2024'
method: HDX rasters/tables.
limits:
- Model-based.
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - area-weighted means and area shares per unit (cells weighted by cell area)
publication_class: A
