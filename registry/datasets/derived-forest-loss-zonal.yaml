id: derived-forest-loss-zonal
title: Forest loss in and around protected areas
description: Annual tree-cover loss inside/outside protected areas and within 5 km buffers, per DS.
source_ids:
- lanka-data-layer-derived
indicators:
- id: env.loss_in_protected
  label: Tree cover loss inside protected areas
  unit: ha
  geo_levels:
  - adm1
  - adm2
  - adm3
  period_type: year
time_coverage:
  from: '2001'
  to: '2024'
method: Overlay of GFC loss year with PA polygons.
limits:
- Includes plantation cycles.
enrichment:
  derived_from:
  - forest-cover-loss
  - osm-protected-areas
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: A
