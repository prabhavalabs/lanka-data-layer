id: derived-rainfall-anomaly
title: Rainfall anomalies and drought index by unit
description: Monthly and seasonal (Maha/Yala) rainfall anomaly and SPI-3/SPI-6 per DS and district.
source_ids:
- lanka-data-layer-derived
indicators:
- id: clim.season_rain_anomaly
  label: Seasonal rainfall anomaly
  unit: '%'
  measure_type: share
  aggregation: none
  class: derived
  dims:
  - season
  geo_levels:
  - adm1
  - adm2
  - adm3
  period_type: month
- id: clim.drought_months
  label: Months in drought (SPI-3 < -1)
  unit: mo
  measure_type: mean
  aggregation: none
  class: derived
  geo_levels:
  - adm1
  - adm2
  - adm3
  period_type: year
time_coverage:
  from: '1981'
  to: '2026'
method: Anomalies vs 1991-2020; gamma-fit SPI.
limits:
- CHIRPS limits apply.
enrichment:
  derived_from:
  - chirps-rainfall
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - area-weighted means and area shares per unit (cells weighted by cell area)
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: A
