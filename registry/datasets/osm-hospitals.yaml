id: osm-hospitals
title: Hospitals and clinics (OSM)
description: Hospitals and clinics mapped in OpenStreetMap, one point each, with operator, operator type, beds,
  emergency department and healthcare speciality where tagged. The same features as the hospital and clinic kinds of
  osm-pois-amenities, with the health attributes kept.
source_ids:
- osm-geofabrik
indicators:
- id: heal.osm_hospitals
  label: Hospitals and clinics (OSM)
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: third_party
  dims:
  - amenity_type
  geo_levels:
  - point
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
time_coverage:
  from: '2026'
method: amenity=hospital|clinic (nodes, ways and relations; areas as their interior point), the filter of v1 and of
  osm-pois-amenities. Counts per unit and per 10,000 people are the hospital/clinic rows of derived-facility-counts.
limits:
- 'Completeness varies: dense in Colombo/Kandy/Galle, thinner in the North, East and estate areas; volunteered data.'
- Absence in OSM is not absence on the ground; the MoH institution register (moh-health-institutions) is not loaded.
enrichment:
  joins:
  - 'point-in-polygon: each feature gets its ADM4 p-code (and ADM3/ADM2/ADM1 by hierarchy) via the grid lookup'
  aggregations:
  - per-unit counts and per-10k rates in derived-facility-counts (amenity_type hospital, clinic)
publication_class: A
kind: features
searchable: true
fields:
- {name: operator, type: string, label: Operator}
- {name: operator_type, type: string, label: Operator type (as tagged)}
- {name: beds, type: integer, label: Beds, unit: '{count}', measure_type: count}
- {name: emergency, type: string, label: Emergency department}
- {name: healthcare, type: string, label: Healthcare type}
- {name: speciality, type: string, label: Healthcare speciality}
- {name: wikidata, type: string, label: Wikidata item}
tiles: {minzoom: 6, maxzoom: 14, attrs: [operator_type, emergency], minzoom_by_kind: {clinic: 9}}
