id: derived-multi-hazard-exposure
title: Multi-hazard exposure (flood, landslide, cyclone, drought, coastal)
description: People, buildings, schools, hospitals and roads exposed to each hazard and to combinations, per GN/DS, with hazard-model
  provenance.
source_ids:
- lanka-data-layer-derived
indicators:
- id: haz.multi_exposed_pop
  label: Population exposed
  unit: '{person}'
  measure_type: count
  aggregation: sum
  class: derived
  dims:
  - hazard
  - id: intensity
    codelist: hazard_level
  geo_levels:
  - adm2
  - adm3
  - adm4
  period_type: snapshot
- id: haz.multi_exposed_buildings
  label: Buildings exposed
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: derived
  dims:
  - hazard
  geo_levels:
  - adm3
  - adm4
  period_type: snapshot
- id: haz.multi_index
  label: Multi-hazard exposure index
  unit: '{index}'
  measure_type: index
  aggregation: none
  class: derived
  geo_levels:
  - adm3
  - adm4
  period_type: snapshot
time_coverage:
  from: 2020
  to: 2026
method: Overlay of hazard rasters with exposure layers on the canonical grid (INFORM risk methodology for aggregation); counts
  never interpolated, only overlaid.
limits:
- Hazard layers differ in return period and resolution; NBRO zonation not open (susceptibility proxy used).
enrichment:
  derived_from:
  - jrc-river-flood-hazard
  - derived-landslide-exposure
  - cyclone-tracks
  - derived-rainfall-anomaly
  - copernicus-dem-terrain
  - google-open-buildings
  - worldpop-pop-grid
  - giga-schools
  - moh-health-institutions
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
publication_class: A
