id: overture-places
title: Places of business and services (Overture)
description: Points of interest (shops, restaurants, lodging, offices, services, schools, clinics, places of worship) from
  the Overture Maps places theme, island-wide, with the Overture taxonomy, confidence score and contributing sources.
source_ids:
- overture-maps
indicators:
- id: biz.overture_places
  label: Places by category
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: third_party
  dims:
  - id: category
    codelist: overture_category
  geo_levels:
  - point
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
- id: biz.places_per_1000
  label: Places per 1,000 population
  unit: '/10*3'
  measure_type: rate
  aggregation: none
  class: third_party
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
time_coverage:
  from: '2026'
method: 'DuckDB query of the release''s GeoParquet (s3://overturemaps-us-west-2/release/<release>/theme=places/type=place)
  by bounding box (registry/tools/overture-extract/overture_places.py, written to GeoJSON), then the geo_file driver; kept:
  confidence >= 0.5, inside Sri Lanka. kind = first level of taxonomy.hierarchy (`other` without one).'
limits:
- Commercial/social-media derived (Meta, Microsoft and others; licences listed per place); urban bias; duplicates.
- Confidence is Overture's existence score, not a verified status; operating_status is mostly empty.
enrichment:
  joins:
  - 'point-in-polygon: each feature gets its ADM4 p-code (and ADM3/ADM2/ADM1 by hierarchy) via the grid lookup'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
  - 'derive: commercial activity density as economic proxy'
publication_class: A
kind: features
searchable: true
fields:
- {name: basic_category, type: string, label: Overture basic category}
- {name: taxonomy_primary, type: string, label: Overture primary taxonomy class}
- {name: taxonomy_l2, type: string, label: Overture taxonomy level 2}
- {name: confidence, type: number, label: Overture confidence score}
- {name: operating_status, type: string, label: Operating status}
- {name: source_datasets, type: string, label: Contributing datasets}
- {name: source_licences, type: string, label: Source licences}
- {name: release, type: string, label: Overture release}
tiles:
  minzoom: 10
  maxzoom: 14
  attrs: [basic_category, confidence]
  drop_densest: true
