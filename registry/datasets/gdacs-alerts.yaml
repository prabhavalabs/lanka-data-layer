id: gdacs-alerts
title: Disaster alerts (cyclones, floods, earthquakes)
description: GDACS event alerts with severity and modelled impact polygons.
source_ids:
- gdacs
indicators:
- id: dis.gdacs_alerts
  label: GDACS alerts
  unit: count
  dims:
  - hazard
  - alert_level
  geo_levels:
  - point
  - polygon
  period_type: day
time_coverage:
  from: '2005'
  to: '2026'
method: API event list + geometry.
limits:
- Global modelled alerts.
enrichment:
  joins:
  - 'polygon overlay with ADM4 units: area share per unit; values allocated area- or population-weighted'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: A
