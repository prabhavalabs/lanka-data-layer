id: lk-metro-proposed-lines
title: Proposed Colombo metro lines and stations
description: Hypothetical/proposed metro lines with stop locations (community proposal).
source_ids:
- nuuuwan-lk-metro
indicators:
- id: tran.metro_stops
  label: Proposed metro stops
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: third_party
  dims:
  - line
  geo_levels:
  - point
  period_type: snapshot
time_coverage:
  from: '2026'
method: data/stops.json of nuuuwan/lk_metro at the fetched commit — one point per stop with its road; the 8 proposed routes (data/routes.json, stop-name sequences) are not drawn as lines yet.
limits:
- A proposal, not an approved project.
enrichment:
  joins:
  - 'point-in-polygon: each feature gets its ADM4 p-code (and ADM3/ADM2/ADM1 by hierarchy) via the grid lookup'
  - line features split at ADM4 boundaries; length per unit computed in a metric CRS (EPSG:5235 SLD99)
  aggregations:
  - input to derived-transit-access scenarios
kind: features
searchable: true
fields:
- {name: road, type: string, label: Road}
tiles: {minzoom: 9, maxzoom: 14, attrs: [road]}
publication_class: A
