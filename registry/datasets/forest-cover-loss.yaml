id: forest-cover-loss
title: Tree cover and annual tree cover loss
description: 2000 tree cover and annual loss 2001-2024 at 30 m.
source_ids:
- hansen-gfc
indicators:
- id: env.treecover_2000
  label: Tree cover 2000 (>30% canopy) area
  unit: ha
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
- id: env.treecover_loss
  label: Tree cover loss
  unit: ha
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
time_coverage:
  from: '2001'
  to: '2024'
method: Tiles 10N_070E/10N_080E; zonal sums by loss year.
limits:
- Includes plantation harvest cycles; not deforestation per se.
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
  - 'cross-source: loss inside protected areas (osm-protected-areas)'
publication_class: A
