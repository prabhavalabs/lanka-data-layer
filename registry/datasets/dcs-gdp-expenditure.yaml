id: dcs-gdp-expenditure
title: GDP by expenditure
description: Consumption, investment, government, exports and imports components of GDP.
source_ids:
- dcs-national-accounts
- dcs-pocketbook-economy
indicators:
- id: econ.gdp_expenditure
  label: Expenditure on GDP
  unit: LKR
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: component
    codelist: gdp_expenditure_component
  - price_basis
  geo_levels:
  - national
  period_type: year
  unit_mult: 6
- id: econ.gdp_expenditure_share
  label: Expenditure on GDP, share of GDP
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  dims:
  - id: component
    codelist: gdp_expenditure_component
  - price_basis
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '2021'
  to: '2025'
method: 'Statistical Pocket Book 2026 table 10.4: expenditure on GDP at current prices, 2021-2025, Rs. million and %.'
limits:
- 'Current prices only; the external balance row (printed in parentheses) is not stored: it is exports less imports.'
- 2025 provisional, 2023-2024 revised.
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: B
