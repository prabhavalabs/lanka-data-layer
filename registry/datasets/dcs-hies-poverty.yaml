id: dcs-hies-poverty
title: Poverty headcount, depth and severity by district
description: Official poverty headcount index, poverty gap and squared gap by district and sector (urban/rural/estate).
source_ids:
- dcs-hies
- dcs-pocketbook
- dcs-statistical-abstract
- dcs-pocketbook-social
indicators:
- id: pov.headcount_ratio
  label: Poverty headcount ratio (official line)
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  dims:
  - sector
  - id: poverty_line
    codelist: official_poverty_line
  geo_levels:
  - national
  - adm2
  period_type: year
- id: pov.poor_households_pct
  label: Percentage of poor households (official line)
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  dims:
  - sector
  - id: poverty_line
    codelist: official_poverty_line
  geo_levels:
  - national
  - adm2
  period_type: year
- id: pov.poverty_gap
  label: Poverty gap index
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  dims:
  - sector
  - id: poverty_line
    codelist: official_poverty_line
  geo_levels:
  - national
  period_type: year
- id: pov.squared_gap
  label: Squared poverty gap
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  dims:
  - sector
  - id: poverty_line
    codelist: official_poverty_line
  geo_levels:
  - national
  period_type: year
- id: pov.poor_population
  label: Population below poverty line
  unit: '{person}'
  measure_type: count
  aggregation: sum
  class: official
  geo_levels:
  - national
  - adm2
  period_type: year
time_coverage:
  from: '1995'
  to: '2024'
method: >-
  PDF tables, reviewed: Statistical Abstract table 4.6 (district headcount, 1995/96-2019) and Statistical
  Pocket Book tables 4.3 (headcount and poor households by sector) and 4.5 (poverty gap and squared gap by
  sector). Survey periods are keyed by their first year (2012/13 -> 2012).
limits:
- Survey rounds are 3-5 years apart.
- District estimates have wide CIs; Northern and Eastern provinces excluded before 2012/13 (national figures
  for 1995/96-2009/10 exclude them, 2006/07 also excludes Trincomalee, 2009/10 Mannar, Kilinochchi and Mullaitivu).
- Two official poverty lines (dimension poverty_line); values on different lines are not comparable.
enrichment:
  joins:
  - 'name->p-code crosswalk at district (ADM2) level: registry/crosswalks/ (ds-name-aliases.csv and siblings) (English/Sinhala/Tamil
    spellings, renamed units)'
  aggregations:
  - counts of poor roll up; rates recomputed
  - 'derive: small-area poverty model with census + nightlights + access (Tier 2)'
publication_class: B
