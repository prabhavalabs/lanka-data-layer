id: ceb-statistical-digest
title: Electricity customers, sales and revenue (CEB)
description: CEB consumer accounts, electricity sales (GWh) and sales revenue by CEB distribution region and by tariff
  category, from the CEB Statistical Digest (two years per edition).
source_ids:
- ceb
indicators:
- id: ener.customers
  label: Electricity consumer accounts
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - id: ceb_region
    codelist: ceb_region
  - tariff_category
  geo_levels:
  - national
  period_type: year
- id: ener.sales_gwh
  label: Electricity sales
  unit: GW.h
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: ceb_region
    codelist: ceb_region
  - tariff_category
  geo_levels:
  - national
  period_type: year
- id: ener.sales_revenue
  label: Revenue from electricity sales
  unit: LKR
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: ceb_region
    codelist: ceb_region
  - tariff_category
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '2024'
  to: '2025'
method: 'PDF tables of the CEB Statistical Digest read through registry templates (ceb/*-by-region, ceb/*-by-tariff): the
  two year columns of each table; % change, share and average columns are derived and not published. Revenue printed in
  LKR million is stored in LKR. Region tables carry tariff_category = total and tariff tables ceb_region = total.'
limits:
- CEB distribution regions are not admin provinces (North Western and Central are split, Colombo City and the Western
  regions cut across districts); figures are not mapped to p-codes.
- CEB sales only; LECO's own retail customers appear as one bulk-supply account.
- The 2025 edition covers 2024-2025; older editions (from 2010) are separate PDFs not yet listed.
enrichment:
  joins:
  - CEB regions -> districts/provinces needs a published area-office crosswalk (not available)
  aggregations:
  - 'average price LKR/kWh = revenue / sales, recomputed from the numerators'
publication_class: B
