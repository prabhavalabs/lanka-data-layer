id: copernicus-dem-terrain
title: Elevation and slope (Copernicus DEM 30 m)
description: Elevation, slope and terrain ruggedness; hillshade tiles.
source_ids:
- copernicus-dem
indicators:
- id: terrain.elevation_mean
  label: Mean elevation
  unit: m
  measure_type: mean
  aggregation: none
  class: third_party
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
- id: terrain.slope_mean
  label: Mean slope
  unit: deg
  measure_type: mean
  aggregation: none
  class: third_party
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
- id: terrain.steep_share
  label: Share of area with slope > 30 deg
  unit: '%'
  measure_type: share
  aggregation: none
  class: third_party
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
time_coverage:
  from: '2011'
  to: '2015'
method: Mosaic tiles, compute slope in projected CRS, zonal stats.
limits:
- DSM (includes canopy/buildings), not bare earth.
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - area-weighted means and area shares per unit (cells weighted by cell area)
  - input to landslide susceptibility and flood models
publication_class: A
