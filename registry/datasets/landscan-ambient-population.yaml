id: landscan-ambient-population
title: Ambient (24-hour average) population, LandScan
description: 1 km ambient population estimates 2000-latest, a daytime-weighted alternative to residential grids.
source_ids:
- landscan
indicators:
- id: pop.landscan_ambient
  label: Ambient population
  unit: persons
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  period_type: year
time_coverage:
  from: '2000'
  to: '2024'
method: Zonal sums at ADM3 and above (1 km cells too coarse for GN).
limits:
- 'Ambient, not residential: not comparable to census counts.'
- '1 km cells: do not publish below ADM3.'
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: A
