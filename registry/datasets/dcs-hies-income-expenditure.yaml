id: dcs-hies-income-expenditure
title: Household income, expenditure and inequality
description: Mean/median household income and expenditure by district, food share, Gini coefficient and income deciles.
source_ids:
- dcs-hies
- dcs-pocketbook
- dcs-pocketbook-social
indicators:
- id: hies.mean_household_income
  label: Mean monthly household income
  unit: LKR
  measure_type: mean
  aggregation: none
  class: official
  dims:
  - sector
  geo_levels:
  - national
  - adm2
  period_type: year
- id: hies.mean_household_expenditure
  label: Mean monthly household expenditure
  unit: LKR
  measure_type: mean
  aggregation: none
  class: official
  dims:
  - id: category
    codelist: coicop_group
  geo_levels:
  - national
  - adm2
  period_type: year
- id: hies.gini_income
  label: Gini coefficient of household income
  unit: '{index}'
  measure_type: index
  aggregation: none
  class: official
  dims:
  - sector
  geo_levels:
  - national
  period_type: year
- id: hies.food_share
  label: Food share of expenditure
  unit: '%'
  measure_type: share
  aggregation: none
  class: official
  geo_levels:
  - national
  - adm2
  period_type: year
- id: hies.nonfood_expenditure
  label: Mean monthly household expenditure by major non-food group
  unit: LKR
  measure_type: mean
  aggregation: none
  class: official
  dims:
  - id: group
    codelist: hies_nonfood_group
  geo_levels:
  - national
  period_type: year
- id: hies.food_item_expenditure
  label: Mean monthly household expenditure on selected food items
  unit: LKR
  measure_type: mean
  aggregation: none
  class: official
  dims:
  - id: item
    codelist: hies_food_item
  geo_levels:
  - national
  period_type: year
- id: hies.food_item_quantity
  label: Mean monthly household quantity of selected food items (unit per item)
  unit: '{various}'
  measure_type: mean
  aggregation: none
  class: official
  dims:
  - id: item
    codelist: hies_food_item
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '2006'
  to: '2024'
method: PDF tables.
limits:
- Nominal values; deflate with NCPI for comparisons.
enrichment:
  joins:
  - 'name->p-code crosswalk at district (ADM2) level: registry/crosswalks/ (ds-name-aliases.csv and siblings) (English/Sinhala/Tamil
    spellings, renamed units)'
  aggregations:
  - survey means, no additive roll-up
publication_class: B
