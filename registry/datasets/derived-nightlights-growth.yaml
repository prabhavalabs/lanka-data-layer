id: derived-nightlights-growth
title: Night-light growth as economic activity proxy
description: Annual change in sum-of-lights per unit, lights per capita, and crisis/disaster dips (2019-2023 shock, Cyclone
  Ditwah).
source_ids:
- lanka-data-layer-derived
indicators:
- id: ntl.growth_yoy
  label: Sum-of-lights change year-on-year
  unit: '%'
  measure_type: share
  aggregation: none
  class: derived
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
- id: ntl.lights_per_capita
  label: Lights per capita
  unit: 'nW/cm2/sr/{person}'
  measure_type: rate
  aggregation: none
  class: derived
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
- id: ntl.modelled_gdp_share
  label: Modelled share of provincial GDP
  unit: '%'
  measure_type: share
  aggregation: none
  class: derived
  geo_levels:
  - adm2
  - adm3
  period_type: year
time_coverage:
  from: '2012'
  to: '2025'
method: Zonal sums; GDP share by allocating provincial GDP using lights + population model.
limits:
- Proxy; agriculture-heavy areas under-represented.
enrichment:
  derived_from:
  - viirs-nightlights
  - worldpop-pop-grid
  - dcs-provincial-gdp
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: A
