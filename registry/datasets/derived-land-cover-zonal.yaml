id: derived-land-cover-zonal
title: Land cover, tree cover and water by admin unit
description: Unit-level shares of cropland, tree cover, built-up, water and protected area combined from WorldCover, GFC,
  GSW and OSM.
source_ids:
- lanka-data-layer-derived
indicators:
- id: lc.unit_profile_share
  label: Land cover profile share
  unit: '%'
  measure_type: share
  aggregation: none
  class: derived
  dims:
  - lc_class
  - id: source
    codelist: land_cover_source
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: snapshot
time_coverage:
  from: '2026'
method: Zonal area shares.
limits:
- Mixed vintages.
enrichment:
  derived_from:
  - worldcover-land-cover
  - forest-cover-loss
  - jrc-surface-water
  - osm-protected-areas
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - area-weighted means and area shares per unit (cells weighted by cell area)
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
publication_class: A
