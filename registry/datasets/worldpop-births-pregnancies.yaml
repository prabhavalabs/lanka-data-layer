id: worldpop-births-pregnancies
title: Estimated births and pregnancies (WorldPop)
description: Gridded estimates of annual live births and pregnancies; denominators for maternal/child service planning.
source_ids:
- worldpop
indicators:
- id: pop.grid_births
  label: Estimated live births
  unit: births/year
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
- id: pop.grid_pregnancies
  label: Estimated pregnancies
  unit: pregnancies/year
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
time_coverage:
  from: '2015'
  to: '2020'
method: Zonal sums of WorldPop births/pregnancies rasters.
limits:
- Older vintage (2015/2020 only); derived from national fertility rates, not registrations.
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - 'derive: births per maternity unit catchment'
publication_class: A
