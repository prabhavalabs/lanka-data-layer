id: wind-power-density
title: Wind speed and power density
description: Mean wind speed and power density at 10-200 m.
source_ids:
- global-wind-atlas
indicators:
- id: ener.wind_power_density
  label: Wind power density at 100 m
  unit: W/m2
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  period_type: snapshot
time_coverage:
  from: '2008'
  to: '2017'
method: GeoTIFF zonal means.
limits:
- Modelled; coastal accuracy limited.
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - area-weighted means and area shares per unit (cells weighted by cell area)
publication_class: A
