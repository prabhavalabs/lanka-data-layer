id: cbsl-bank-branches
title: Bank branches and banking density by district
description: Commercial and specialised bank branches and ATMs per district, branches per 100,000 people.
source_ids:
- cbsl-ess
indicators:
- id: fin.bank_branches
  label: Bank branches
  unit: count
  dims:
  - bank_type
  geo_levels:
  - national
  - adm2
  period_type: year
- id: fin.branches_per_100k
  label: Bank branches per 100,000 persons
  unit: per 100k
  geo_levels:
  - national
  - adm2
  period_type: year
time_coverage:
  from: '2015'
  to: '2025'
method: ESS tables 7.8-7.9.
limits:
- Counts only; no locations (use osm-pois-amenities for points).
enrichment:
  joins:
  - 'name->p-code crosswalk at district (ADM2) level: registry/crosswalks/ (ds-name-aliases.csv and siblings) (English/Sinhala/Tamil
    spellings, renamed units)'
  aggregations:
  - roll-up ADM2->ADM1->ADM0 by p-code (sum counts; recompute ratios)
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
  - 'cross-source: compare with OSM bank points; travel time to bank'
publication_class: A
