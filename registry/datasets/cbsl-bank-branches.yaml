id: cbsl-bank-branches
title: Bank branches and banking density by district
description: Branches of licensed commercial and specialised banks by bank and district (2022 onwards) and by bank
  nationally (2013 onwards), branches per 100,000 persons, and district co-operative rural bank outlets.
source_ids:
- cbsl-ess
indicators:
- id: fin.bank_branches
  label: Bank branches
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - bank
  geo_levels:
  - national
  - adm2
  period_type: year
- id: fin.branches_per_100k
  label: Bank branches per 100,000 persons
  unit: '/10*5'
  measure_type: rate
  aggregation: none
  class: official
  dims:
  - bank
  geo_levels:
  - national
  - adm2
  period_type: year
- id: fin.rural_bank_branches
  label: District co-operative rural bank outlets
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  geo_levels:
  - national
  period_type: year
- id: fin.outlets_per_100k_incl_rural
  label: Bank branches including rural bank outlets per 100,000 persons
  unit: '/10*5'
  measure_type: rate
  aggregation: none
  class: official
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '2013'
  to: '2025'
method: CBSL Economic and Social Statistics of Sri Lanka 2026, tables 7.8 (district) and 7.9 (national), Excel, read
  cell by cell.
limits:
- Counts only; no locations (use osm-pois-amenities for points).
- All banking outlets except student savings units; the latest year is provisional and earlier years of 7.8 are revised.
- District density uses CBSL's population figures (thousands) printed beside the counts; the population column itself is
  not loaded (use the DCS mid-year population).
- District rows exist only for 2022 onwards in the 2026 edition.
enrichment:
  joins:
  - 'name->p-code crosswalk at district (ADM2) level: registry/crosswalks/ (ds-name-aliases.csv and siblings) (English/Sinhala/Tamil
    spellings, renamed units)'
  aggregations:
  - roll-up ADM2->ADM1->ADM0 by p-code (sum counts; recompute ratios)
  - per-capita and per-100k rates using the matching-year population denominator (dcs-midyear-population-district; cod-ps-lka-population
    below district)
  - 'cross-source: compare with OSM bank points; travel time to bank'
publication_class: A
