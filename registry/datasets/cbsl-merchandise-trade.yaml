id: cbsl-merchandise-trade
title: Merchandise exports and imports
description: Monthly merchandise exports and imports in US dollars by CBSL category (tea, apparel, rubber, fuel,
  intermediate and investment goods), January 2007 onwards.
source_ids:
- cbsl-statistical-tables
indicators:
- id: trade.exports_usd
  label: Merchandise exports
  unit: USD
  unit_mult: 6
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: category
    codelist: trade_category
  geo_levels:
  - national
  period_type: month
- id: trade.imports_usd
  label: Merchandise imports
  unit: USD
  unit_mult: 6
  measure_type: sum
  aggregation: sum
  class: official
  dims:
  - id: category
    codelist: trade_category
  geo_levels:
  - national
  period_type: month
time_coverage:
  from: 2007-01
  to: 2026-09
method: CBSL statistical tables 2.02 and 2.04, USD sheets (2007 onwards), read cell by cell.
limits:
- Provisional for latest months (marked (b) in the workbook).
- CBSL notes that the external trade classification was revised in 2010 (the HS concordance sheets cover 2007 to January 2023 and later).
- The trade balance is not published in these sheets; derive it as exports total minus imports total.
- Annual totals by category are sums of the monthly values (no annual sheet in these workbooks).
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
publication_class: A
