id: earthquakes-near-lka
title: Earthquakes in the region
description: M4+ earthquakes within the Indian Ocean region around Sri Lanka (tsunami-relevant).
source_ids:
- usgs-earthquakes
indicators:
- id: haz.earthquakes
  label: Earthquakes M4+
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: third_party
  geo_levels:
  - point
  period_type: day
time_coverage:
