id: wits-trade-partners
title: Trade by partner and product (WITS)
description: Annual exports/imports by partner country and HS section.
source_ids:
- wits-comtrade
indicators:
- id: trade.bilateral
  label: Trade value by partner and product
  unit: USD
  unit_mult: 3
  measure_type: sum
  aggregation: sum
  class: third_party
  dims:
  - id: partner
    codelist: country
  - id: product
    codelist: hs_section
  - flow
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '1990'
  to: '2024'
method: WITS SDMX API.
limits:
- Mirror-data discrepancies; HS revisions.
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - partner and product shares
publication_class: A
