id: dmt-vehicle-registrations
title: Vehicle registrations and fleet
description: New registrations by vehicle class (monthly) and cumulative registered fleet.
source_ids:
- dmt
- dcs-pocketbook
indicators:
- id: tran.new_registrations
  label: New vehicle registrations
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - vehicle_class
  geo_levels:
  - national
  period_type: month
- id: tran.registered_fleet
  label: Cumulative registered vehicles
  unit: '{count}'
  measure_type: count
  aggregation: sum
  class: official
  dims:
  - vehicle_class
  geo_levels:
  - national
  period_type: year
time_coverage:
  from: '2000'
  to: '2026'
method: HTML tables.
limits:
- Cumulative fleet includes scrapped vehicles; no district of owner published.
enrichment:
  joins:
  - 'national series: no spatial join; joins to other national series by period'
  aggregations:
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
  - vehicles per 1,000 people
publication_class: A
