id: ghsl-built-up
title: Built-up surface and volume 1975-2030 (GHSL)
description: Built-up surface (m2) and built volume (m3) per 100 m cell for 5-year epochs 1975-2030, residential vs non-residential.
source_ids:
- ghsl
indicators:
- id: built.surface_m2
  label: Built-up surface
  unit: m2
  measure_type: sum
  aggregation: sum
  class: third_party
  dims:
  - use
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
- id: built.volume_m3
  label: Built-up volume
  unit: m3
  measure_type: sum
  aggregation: sum
  class: third_party
  dims:
  - use
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
- id: built.share_pct
  label: Built-up share of land
  unit: '%'
  measure_type: share
  aggregation: none
  class: third_party
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
time_coverage:
  from: '1975'
  to: '2030'
method: Mollweide tiles reprojected to WGS84, area-preserving resample to canonical grid, zonal sums.
limits:
- 2025/2030 epochs are projections.
- 100 m resolution under-detects scattered rural buildings.
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
  - 'time series derivations: year-on-year change, 3-period moving average, index to base year'
  - 'derive: urban growth rate per DS 1975-2030'
publication_class: A
