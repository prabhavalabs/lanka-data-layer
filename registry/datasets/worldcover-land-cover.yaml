id: worldcover-land-cover
title: Land cover 10 m (ESA WorldCover)
description: 11-class land cover (tree, shrub, grass, cropland, built-up, bare, water, wetland, mangrove) for 2020 and 2021.
source_ids:
- esa-worldcover
indicators:
- id: lc.class_share
  label: Land cover class share
  unit: '%'
  measure_type: share
  aggregation: none
  class: third_party
  dims:
  - lc_class
  geo_levels:
  - raster
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
- id: lc.class_area
  label: Land cover class area
  unit: har
  measure_type: sum
  aggregation: sum
  class: third_party
  dims:
  - lc_class
  geo_levels:
  - adm1
  - adm2
  - adm3
  - adm4
  period_type: year
time_coverage:
  from: '2020'
  to: '2021'
method: COG tiles N06E078..N09E081; class fractions per canonical cell; zonal area.
limits:
- Two years only; 2020 and 2021 use different algorithms (not a change product).
enrichment:
  joins:
  - 'zonal statistics: raster resampled to the canonical 0.001 deg grid, grid cell -> ADM4 via the reverse-geocode lookup;
    ADM4 values roll up by p-code'
  aggregations:
  - area-weighted means and area shares per unit (cells weighted by cell area)
  - 'roll-up ADM4->ADM3->ADM2->ADM1->ADM0 by p-code: sum counts, recompute ratios from numerators and denominators (never
    average rates)'
publication_class: A
# land-cover-district (dc): the ADM2 rows are the district shares; ADM3 (DS) and ADM4 (GN) come from the same pass.
expect:
- {check: range, indicator: lc.class_share, min: 0, max: 100}
- {check: range, indicator: lc.class_area, min: 0, max: 1000000}
- {check: completeness, indicator: lc.class_share, level: 1, min_units: 9}
- {check: completeness, indicator: lc.class_share, level: 2, min_units: 25}
- {check: completeness, indicator: lc.class_share, level: 3, min_units: 330}
- {check: sum_to_parent, indicator: lc.class_area, tol_pct: 0.5, severity: warn,
   note: "Warn only: parents come from geo.admin_units, which records Ampara (LK52) under Uva (LK8); passes on 2026-11-22."}
- check: sql
  note: The class shares of every unit add up to 100 %.
  query: >-
    SELECT geo_code FROM stage_obs WHERE indicator_id = 'lc.class_share'
    GROUP BY geo_code, period_start HAVING abs(sum(value) - 100) > 0.01
